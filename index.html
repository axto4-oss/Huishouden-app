/* =========================================================
   REALTIME
========================================================= */

function setupRealtime() {

  if (
    !householdId
  ) {
    return;
  }

  if (
    realtimeChannel
  ) {

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        `household-${householdId}`
      )


      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "households",
          filter:
            `id=eq.${householdId}`
        },
        () => {

          refreshFromDatabase(
            "household"
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "household_settings",
          filter:
            `household_id=eq.${householdId}`
        },
        () => {

          refreshFromDatabase(
            "settings"
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "tabs",
          filter:
            `household_id=eq.${householdId}`
        },
        () => {

          refreshFromDatabase(
            "tabs"
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "frequencies",
          filter:
            `household_id=eq.${householdId}`
        },
        () => {

          refreshFromDatabase(
            "frequencies"
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "tasks",
          filter:
            `household_id=eq.${householdId}`
        },
        () => {

          refreshFromDatabase(
            "tasks"
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "completions",
          filter:
            `household_id=eq.${householdId}`
        },
        () => {

          refreshFromDatabase(
            "completions"
          );

        }
      )


      .subscribe(
        status => {

          if (
            status ===
            "SUBSCRIBED"
          ) {

            setSyncStatus(
              "Live synchronisatie"
            );

          }

          if (
            status ===
            "CHANNEL_ERROR"
          ) {

            setSyncStatus(
              "Realtime fout"
            );

          }

        }
      );

}


let refreshTimer = null;

async function refreshFromDatabase(
  reason
) {

  /*
    Meerdere realtime events kunnen tegelijk
    binnenkomen. We bundelen ze kort zodat één
    wijziging niet voor zes reloads zorgt.
  */

  clearTimeout(
    refreshTimer
  );

  refreshTimer =
    setTimeout(
      async () => {

        if (
          suppressRealtime ||
          loadingData
        ) {
          return;
        }

        try {

          await loadHouseholdData();

          render();

        } catch (error) {

          console.error(
            "Realtime refresh:",
            error
          );

          setSyncStatus(
            "Synchronisatiefout"
          );

        }

      },
      180
    );

}


/* =========================================================
   AUTH
========================================================= */

let authMode =
  "login";


function setAuthMode(
  mode
) {

  authMode =
    mode;

  document
    .getElementById(
      "loginModeButton"
    )
    .classList.toggle(
      "active",
      mode === "login"
    );

  document
    .getElementById(
      "signupModeButton"
    )
    .classList.toggle(
      "active",
      mode === "signup"
    );

  document.getElementById(
    "authSubmit"
  ).textContent =
    mode === "login"
      ? "Inloggen"
      : "Account maken";

  hideAuthMessages();

}


function hideAuthMessages() {

  document
    .getElementById(
      "authError"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "authInfo"
    )
    .classList.add(
      "hidden"
    );

}


function showAuthError(
  message
) {

  const element =
    document.getElementById(
      "authError"
    );

  element.textContent =
    message;

  element.classList.remove(
    "hidden"
  );

}


function showAuthInfo(
  message
) {

  const element =
    document.getElementById(
      "authInfo"
    );

  element.textContent =
    message;

  element.classList.remove(
    "hidden"
  );

}


async function handleAuthSubmit() {

  hideAuthMessages();

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  if (!email) {

    showAuthError(
      "Vul je e-mailadres in."
    );

    return;

  }

  if (
    password.length < 6
  ) {

    showAuthError(
      "Het wachtwoord moet minstens 6 tekens bevatten."
    );

    return;

  }


  const button =
    document.getElementById(
      "authSubmit"
    );

  button.disabled =
    true;

  button.textContent =
    "Even wachten…";


  try {

    if (
      authMode ===
      "login"
    ) {

      const result =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (result.error) {
        throw result.error;
      }

    } else {

      const result =
        await supabaseClient.auth.signUp({
          email,
          password
        });

      if (result.error) {
        throw result.error;
      }

      if (
        !result.data.session
      ) {

        showAuthInfo(
          "Je account is aangemaakt. Controleer je e-mail om je account te bevestigen en log daarna in."
        );

        return;

      }

    }

  } catch (error) {

    console.error(
      error
    );

    showAuthError(
      translateAuthError(
        error
      )
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      authMode === "login"
        ? "Inloggen"
        : "Account maken";

  }

}


function translateAuthError(
  error
) {

  const message =
    String(
      error?.message ||
      error ||
      ""
    );

  if (
    message.toLowerCase()
      .includes(
        "invalid login credentials"
      )
  ) {

    return "E-mailadres of wachtwoord is niet correct.";

  }

  if (
    message.toLowerCase()
      .includes(
        "email not confirmed"
      )
  ) {

    return "Je e-mailadres is nog niet bevestigd.";

  }

  if (
    message.toLowerCase()
      .includes(
        "user already registered"
      )
  ) {

    return "Voor dit e-mailadres bestaat al een account.";

  }

  return message ||
    "Er is iets misgegaan.";

}

/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event ===
      "SIGNED_OUT"
    ) {

      currentUser =
        null;

      householdId =
        null;

      if (
        realtimeChannel
      ) {

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;

      }

      document
        .getElementById(
          "app"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "loadingScreen"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "authScreen"
        )
        .classList.remove(
          "hidden"
        );

      return;

    }

    if (
      session?.user
    ) {

      await startForUser(
        session.user
      );

    } else {

      document
        .getElementById(
          "loadingScreen"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "authScreen"
        )
        .classList.remove(
          "hidden"
        );

    }

  }
);

/* =========================================================

========================================================= */

(async function init() {

  try {

    const result =
      await supabaseClient.auth.getSession();

    if (
      result.error
    ) {
      throw result.error;
    }

    if (
      result.data.session?.user
    ) {

      await startForUser(
        result.data.session.user
      );

    } else {

      document
        .getElementById(
          "loadingScreen"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "authScreen"
        )
        .classList.remove(
          "hidden"
        );

    }

  } catch (error) {

    console.error(
      error
    );

    document
      .getElementById(
        "loadingScreen"
      )
      .classList.add(
        "hidden"
      );

    document
      .getElementById(
        "authScreen"
      )
      .classList.remove(
        "hidden"
      );

    showAuthError(
      "Verbinden met Supabase is mislukt."
    );

  }

})();
