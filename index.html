<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f5">
<title>Huishouden</title>

<style>
:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --text: #222;
  --muted: #777;
  --border: #e7e7e7;
  --primary: #222;
  --green: #39a96b;
  --red: #e05252;
  --gray: #aaa;
  --shadow: 0 2px 12px rgba(0,0,0,.06);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  max-width: 700px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 90px;
}

/* HEADER */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(245,245,245,.95);
  backdrop-filter: blur(10px);
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
}

.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.app-title {
  font-size: 21px;
  font-weight: 700;
}

.menu-button {
  width: 42px;
  height: 42px;
  border: 0;
  background: white;
  border-radius: 12px;
  font-size: 22px;
  box-shadow: var(--shadow);
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-top: 10px;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab-button {
  flex: 0 0 auto;
  border: 0;
  background: white;
  color: #666;
  border-radius: 10px;
  padding: 9px 13px;
  white-space: nowrap;
}

.tab-button.active {
  background: var(--primary);
  color: white;
}

/* VIEWS */

.view {
  display: none;
  padding: 18px 14px;
}

.view.active {
  display: block;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.page-title {
  font-size: 24px;
  font-weight: 700;
}

.add-button {
  border: 0;
  background: var(--primary);
  color: white;
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 600;
}

/* TASKS */

.task-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.frequency-section {
  margin-bottom: 22px;
}

.frequency-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0 0 9px 3px;
}

.task-card {
  background: var(--card);
  border-radius: 15px;
  padding: 14px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-status {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  flex: 0 0 11px;
  background: var(--gray);
}

.task-status.green {
  background: var(--green);
}

.task-status.red {
  background: var(--red);
}

.task-content {
  flex: 1;
  min-width: 0;
}

.task-title {
  font-size: 15px;
  font-weight: 600;
}

.task-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}

.task-points {
  font-size: 13px;
  font-weight: 700;
  color: #666;
  white-space: nowrap;
}

.task-menu {
  border: 0;
  background: transparent;
  color: #999;
  font-size: 20px;
  padding: 3px;
}

.empty {
  background: white;
  border-radius: 15px;
  padding: 25px;
  text-align: center;
  color: var(--muted);
  box-shadow: var(--shadow);
}

/* MENU */

.menu-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,.25);
}

.menu-overlay.open {
  display: block;
}

.side-menu {
  position: absolute;
  top: 0;
  right: 0;
  width: min(340px, 88vw);
  height: 100%;
  background: white;
  padding: 22px;
  box-shadow: -5px 0 25px rgba(0,0,0,.12);
}

.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.menu-title {
  font-size: 22px;
  font-weight: 700;
}

.close-menu {
  border: 0;
  background: #f3f3f3;
  width: 38px;
  height: 38px;
  border-radius: 10px;
}

.menu-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.menu-item {
  border: 0;
  background: #f6f6f6;
  padding: 14px;
  border-radius: 12px;
  text-align: left;
  font-weight: 600;
}

/* SETTINGS */

.settings-section {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.settings-section h3 {
  margin: 0 0 14px;
  font-size: 17px;
}

.field {
  margin-bottom: 13px;
}

.field:last-child {
  margin-bottom: 0;
}

.field label {
  display: block;
  font-size: 13px;
  color: #666;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  padding: 11px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #999;
}

.settings-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.settings-row > * {
  flex: 1;
}

.small-button {
  flex: 0 0 auto !important;
  border: 0;
  border-radius: 10px;
  background: #eee;
  padding: 10px 12px;
}

.primary-button {
  border: 0;
  background: var(--primary);
  color: white;
  border-radius: 11px;
  padding: 12px 16px;
  font-weight: 600;
}

.danger-button {
  border: 0;
  background: #fbe9e9;
  color: #b33;
  border-radius: 10px;
  padding: 9px 12px;
}

.config-card {
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 12px;
  margin-bottom: 10px;
}

.config-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.config-card-title {
  font-weight: 700;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
}

.checkbox-row input {
  width: auto;
}

/* POINTS */

.points-card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}

.points-number {
  font-size: 38px;
  font-weight: 800;
}

.points-label {
  color: var(--muted);
}

.balance-bar {
  display: flex;
  height: 12px;
  border-radius: 99px;
  overflow: hidden;
  background: #eee;
  margin-top: 20px;
}

.balance-you,
.balance-partner {
  width: 50%;
}

/* HISTORY */

.history-item {
  background: white;
  border-radius: 13px;
  padding: 13px;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
}

.history-title {
  font-weight: 600;
}

.history-meta {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

/* MODALS */

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.35);
  align-items: flex-end;
}

.modal-backdrop.open {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  background: white;
  border-radius: 22px 22px 0 0;
  padding: 20px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal h2 {
  margin: 0 0 17px;
  font-size: 21px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 17px;
}

.modal-actions button {
  flex: 1;
}

.person-buttons {
  display: grid;
  gap: 9px;
}

.person-button {
  border: 0;
  background: #f3f3f3;
  padding: 14px;
  border-radius: 12px;
  font-weight: 600;
}

.hidden {
  display: none !important;
}

@media (min-width: 701px) {
  .modal {
    border-radius: 22px;
    margin-bottom: 30px;
  }

  .modal-backdrop {
    align-items: center;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-row">
      <div class="app-title">🏠 Huishouden</div>
      <button class="menu-button" id="menuButton">☰</button>
    </div>

    <div class="tabs" id="tabs"></div>
  </header>

  <main id="views"></main>

</div>

<!-- MENU -->

<div class="menu-overlay" id="menuOverlay">
  <aside class="side-menu">
    <div class="menu-header">
      <div class="menu-title">Menu</div>
      <button class="close-menu" id="closeMenu">✕</button>
    </div>

    <div class="menu-items">
      <button class="menu-item" data-menu-view="points">🏆 Punten</button>
      <button class="menu-item" data-menu-view="history">📜 Geschiedenis</button>
      <button class="menu-item" data-menu-view="settings">⚙️ Instellingen</button>
    </div>
  </aside>
</div>

<!-- COMPLETION MODAL -->

<div class="modal-backdrop" id="completionModal">
  <div class="modal">
    <h2 id="completionTitle">Wie heeft dit gedaan?</h2>

    <div class="person-buttons">
      <button class="person-button" id="completeYou"></button>
      <button class="person-button" id="completePartner"></button>
      <button class="person-button" id="completeTogether">👫 Samen</button>
    </div>

    <div class="modal-actions">
      <button class="small-button" id="cancelCompletion">Annuleren</button>
    </div>
  </div>
</div>

<!-- TASK MODAL -->

<div class="modal-backdrop" id="taskModal">
  <div class="modal">
    <h2 id="taskModalTitle">Taak</h2>

    <div class="field">
      <label for="taskTitle">Naam</label>
      <input id="taskTitle" type="text">
    </div>

    <div class="field" id="taskFrequencyField">
      <label for="taskFrequency">Frequentie</label>
      <select id="taskFrequency"></select>
    </div>

    <div class="field" id="taskPointsField">
      <label for="taskPoints">Punten</label>
      <input id="taskPoints" type="number" min="0" value="1">
    </div>

    <div class="modal-actions">
      <button class="primary-button" id="saveTask">Opslaan</button>
      <button class="small-button" id="cancelTask">Annuleren</button>
      <button class="danger-button hidden" id="deleteTask">Verwijderen</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEYS = {
  tasks: "householdTasksV3",
  completions: "householdCompletionsV3",
  settings: "householdSettingsV3",

  // Oude versies
  oldTasks: "householdTasksV2",
  oldCompletions: "householdCompletions",
  oldSettings: "householdSettingsV2"
};


/* =========================================================
   DEFAULT CONFIGURATION
========================================================= */

function createDefaultSettings() {
  return {
    youName: "Jij",
    partnerName: "Partner",
    startDate: "",

    tabs: [
      {
        id: "tab-recurring",
        name: "Repeterend",
        icon: "🔄",
        mode: "scheduled",
        hasFrequency: true,
        hasPoints: true
      },
      {
        id: "tab-when-needed",
        name: "Wanneer nodig",
        icon: "⚡",
        mode: "repeatable",
        hasFrequency: false,
        hasPoints: true
      },
      {
        id: "tab-later",
        name: "Later",
        icon: "📌",
        mode: "one_time",
        hasFrequency: false,
        hasPoints: false
      }
    ],

    frequencies: [
      {
        id: "daily",
        name: "Dagelijks",
        unit: "day",
        interval: 1
      },
      {
        id: "weekly",
        name: "Wekelijks",
        unit: "week",
        interval: 1
      },
      {
        id: "biweekly",
        name: "Om de 2 weken",
        unit: "week",
        interval: 2
      },
      {
        id: "monthly",
        name: "Maandelijks",
        unit: "month",
        interval: 1
      }
    ]
  };
}


/* =========================================================
   DEFAULT TASKS
========================================================= */

function createDefaultTasks() {
  return [
    ["Bovenverdieping stofzuigen", "tab-recurring", "weekly", 3],
    ["Bovenverdieping dweilen", "tab-recurring", "weekly", 3],
    ["Benedenverdieping dweilen", "tab-recurring", "weekly", 3],
    ["WC kuisen", "tab-recurring", "weekly", 2],
    ["Lakens vervangen", "tab-recurring", "weekly", 2],
    ["Douchewand kuisen", "tab-recurring", "weekly", 2],
    ["Spiegels kuisen", "tab-recurring", "weekly", 2],
    ["Stof afdoen", "tab-recurring", "biweekly", 3],
    ["Vuilbakken uitkuisen", "tab-recurring", "biweekly", 2],
    ["Keuken deepclean", "tab-recurring", "monthly", 5],
    ["Ramen kuisen", "tab-recurring", "monthly", 5],
    ["Koelkast uitkuisen", "tab-recurring", "monthly", 4],
    ["Deurklinken afwassen", "tab-recurring", "monthly", 2],
    ["Onder bed & zetel stofzuigen", "tab-recurring", "monthly", 2],
    ["Droogkast & wasmachine reinigen", "tab-recurring", "monthly", 2],
    ["WC-bril afdoen & kuisen", "tab-recurring", "monthly", 1],
    ["Ontstopper in leidingen doen", "tab-recurring", "monthly", 1],

    ["Wasmachine opzetten", "tab-when-needed", null, 1],
    ["Droogkast opzetten", "tab-when-needed", null, 1],
    ["Vaatwasser uitladen", "tab-when-needed", null, 1],
    ["Was ophangen", "tab-when-needed", null, 1],
    ["Was opvouwen & strijken", "tab-when-needed", null, 2],
    ["Boodschappen doen", "tab-when-needed", null, 3],
    ["Afval buitenzetten", "tab-when-needed", null, 1],
    ["Kleine vuilbakken WC leegmaken", "tab-when-needed", null, 1],
    ["Glas naar glascontainer brengen", "tab-when-needed", null, 2]
  ].map((item, index) => ({
    id: "task-" + (index + 1),
    title: item[0],
    tabId: item[1],
    frequencyId: item[2],
    points: item[3],
    createdAt: new Date().toISOString()
  }));
}


/* =========================================================
   DATA
========================================================= */

let settings;
let tasks;
let completions;

let currentView = null;

let editingTaskId = null;
let editingTabId = null;
let completionTaskId = null;


/* =========================================================
   LOAD / SAVE
========================================================= */

function loadData() {
  const savedSettings = localStorage.getItem(STORAGE_KEYS.settings);
  const savedTasks = localStorage.getItem(STORAGE_KEYS.tasks);
  const savedCompletions = localStorage.getItem(STORAGE_KEYS.completions);

  if (savedSettings) {
    settings = JSON.parse(savedSettings);
  } else {
    settings = migrateOldSettings();
  }

  if (savedTasks) {
    tasks = JSON.parse(savedTasks);
  } else {
    tasks = migrateOldTasks();
  }

  if (savedCompletions) {
    completions = JSON.parse(savedCompletions);
  } else {
    completions = migrateOldCompletions();
  }

  normalizeData();

  saveAll();
}


function saveAll() {
  localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
  localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks));
  localStorage.setItem(STORAGE_KEYS.completions, JSON.stringify(completions));
}


/* =========================================================
   MIGRATION OLD VERSION
========================================================= */

function migrateOldSettings() {
  const old = localStorage.getItem(STORAGE_KEYS.oldSettings);

  if (!old) {
    return createDefaultSettings();
  }

  try {
    const parsed = JSON.parse(old);
    const defaults = createDefaultSettings();

    return {
      ...defaults,
      youName: parsed.youName || defaults.youName,
      partnerName: parsed.partnerName || defaults.partnerName,
      startDate: parsed.startDate || ""
    };
  } catch {
    return createDefaultSettings();
  }
}


function migrateOldTasks() {
  const old = localStorage.getItem(STORAGE_KEYS.oldTasks);

  if (!old) {
    return createDefaultTasks();
  }

  try {
    const oldTasks = JSON.parse(old);

    return oldTasks.map((task, index) => {
      let tabId = "tab-recurring";

      if (task.category === "when_needed") {
        tabId = "tab-when-needed";
      }

      if (task.category === "later") {
        tabId = "tab-later";
      }

      return {
        id: task.id || "task-migrated-" + index,
        title: task.title || "Taak",
        tabId,
        frequencyId: task.frequency || null,
        points: Number(task.points || 0),
        createdAt: new Date().toISOString()
      };
    });
  } catch {
    return createDefaultTasks();
  }
}


function migrateOldCompletions() {
  const old = localStorage.getItem(STORAGE_KEYS.oldCompletions);

  if (!old) {
    return [];
  }

  try {
    return JSON.parse(old);
  } catch {
    return [];
  }
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeData() {
  const defaults = createDefaultSettings();

  settings = {
    ...defaults,
    ...(settings || {})
  };

  if (!Array.isArray(settings.tabs) || !settings.tabs.length) {
    settings.tabs = defaults.tabs;
  }

  if (!Array.isArray(settings.frequencies) || !settings.frequencies.length) {
    settings.frequencies = defaults.frequencies;
  }

  settings.tabs = settings.tabs.map(tab => ({
    id: tab.id || crypto.randomUUID(),
    name: tab.name || "Tabblad",
    icon: tab.icon || "📋",
    mode: tab.mode || "repeatable",
    hasFrequency: Boolean(tab.hasFrequency),
    hasPoints: Boolean(tab.hasPoints)
  }));

  settings.frequencies = settings.frequencies.map(freq => ({
    id: freq.id || crypto.randomUUID(),
    name: freq.name || "Frequentie",
    unit: freq.unit || "week",
    interval: Math.max(1, Number(freq.interval) || 1)
  }));

  tasks = (Array.isArray(tasks) ? tasks : []).map(task => ({
    id: task.id || crypto.randomUUID(),
    title: task.title || "Taak",
    tabId: task.tabId || "tab-recurring",
    frequencyId: task.frequencyId ?? task.frequency ?? null,
    points: Number(task.points || 0),
    createdAt: task.createdAt || new Date().toISOString()
  }));

  completions = Array.isArray(completions) ? completions : [];

  // Zorg dat oude taken niet verdwijnen als hun tab niet meer bestaat.
  tasks.forEach(task => {
    if (!settings.tabs.some(tab => tab.id === task.tabId)) {
      task.tabId = settings.tabs[0].id;
    }

    const tab = getTab(task.tabId);

    if (!tab?.hasFrequency) {
      task.frequencyId = null;
    }

    if (!tab?.hasPoints) {
      task.points = 0;
    }
  });
}


/* =========================================================
   HELPERS
========================================================= */

function getTab(tabId) {
  return settings.tabs.find(tab => tab.id === tabId);
}


function getFrequency(frequencyId) {
  return settings.frequencies.find(freq => freq.id === frequencyId);
}


function getTask(taskId) {
  return tasks.find(task => task.id === taskId);
}


function getToday() {
  const date = new Date();
  date.setHours(0, 0, 0, 0);
  return date;
}


function dateOnly(value) {
  const d = new Date(value);
  d.setHours(0, 0, 0, 0);
  return d;
}


function formatDate(value) {
  return new Intl.DateTimeFormat("nl-BE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }).format(new Date(value));
}


function getStartDate() {
  if (!settings.startDate) {
    return null;
  }

  return dateOnly(settings.startDate);
}


function isBeforeStartDate(date) {
  const start = getStartDate();

  if (!start) {
    return false;
  }

  return dateOnly(date) < start;
}


function addDays(date, amount) {
  const result = new Date(date);
  result.setDate(result.getDate() + amount);
  return result;
}


function addMonths(date, amount) {
  const result = new Date(date);
  result.setMonth(result.getMonth() + amount);
  return result;
}


function startOfDay(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  return d;
}


function startOfWeekMonday(date) {
  const d = startOfDay(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  return addDays(d, diff);
}


function monthIndex(date) {
  return date.getFullYear() * 12 + date.getMonth();
}


/* =========================================================
   GENERIC PERIOD SYSTEM
========================================================= */

function getPeriodInfo(task, date = getToday()) {
  const tab = getTab(task.tabId);

  if (!tab || !tab.hasFrequency || !task.frequencyId) {
    return null;
  }

  const frequency = getFrequency(task.frequencyId);

  if (!frequency) {
    return null;
  }

  const current = startOfDay(date);
  const interval = Math.max(1, Number(frequency.interval) || 1);

  let start;
  let end;

  if (frequency.unit === "day") {
    const anchor = getStartDate() || startOfDay(task.createdAt || current);
    const diff = Math.floor((current - anchor) / 86400000);
    const block = Math.floor(diff / interval);

    start = addDays(anchor, block * interval);
    end = addDays(start, interval - 1);

  } else if (frequency.unit === "week") {
    const anchor = startOfWeekMonday(
      getStartDate() || startOfDay(task.createdAt || current)
    );

    const currentWeek = startOfWeekMonday(current);
    const diffWeeks = Math.floor((currentWeek - anchor) / (7 * 86400000));
    const block = Math.floor(diffWeeks / interval);

    start = addDays(anchor, block * interval * 7);
    end = addDays(start, interval * 7 - 1);

  } else if (frequency.unit === "month") {
    const anchor = getStartDate()
      ? new Date(getStartDate().getFullYear(), getStartDate().getMonth(), 1)
      : new Date(
          new Date(task.createdAt || current).getFullYear(),
          new Date(task.createdAt || current).getMonth(),
          1
        );

    const diffMonths = monthIndex(current) - monthIndex(anchor);
    const block = Math.floor(diffMonths / interval);

    start = addMonths(anchor, block * interval);
    end = addDays(addMonths(start, interval), -1);

  } else {
    return null;
  }

  const id =
    start.toISOString().slice(0,10) +
    "_" +
    end.toISOString().slice(0,10);

  return {
    id,
    start,
    end,
    frequency
  };
}


function getPreviousPeriodInfo(task, date = getToday()) {
  const current = getPeriodInfo(task, date);

  if (!current) {
    return null;
  }

  const previousDate = addDays(current.start, -1);

  return getPeriodInfo(task, previousDate);
}


/* =========================================================
   COMPLETIONS
========================================================= */

function getTaskCompletions(taskId) {
  return completions.filter(c => c.taskId === taskId);
}


function getCurrentCompletion(task) {
  const period = getPeriodInfo(task);

  if (!period) {
    return null;
  }

  return getTaskCompletions(task.id).find(
    completion => completion.period === period.id
  ) || null;
}


function getLastCompletion(task) {
  const list = getTaskCompletions(task.id)
    .slice()
    .sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));

  return list[0] || null;
}


/* =========================================================
   STATUS
========================================================= */

function isOverdue(task) {
  const tab = getTab(task.tabId);

  if (!tab || tab.mode !== "scheduled" || !tab.hasFrequency) {
    return false;
  }

  if (getCurrentCompletion(task)) {
    return false;
  }

  const previous = getPreviousPeriodInfo(task);

  if (!previous) {
    return false;
  }

  // De vorige periode moet volledig voorbij zijn.
  if (previous.end >= getToday()) {
    return false;
  }

  // Periodes vóór de startdatum tellen niet.
  if (isBeforeStartDate(previous.end)) {
    return false;
  }

  const previousCompletion = getTaskCompletions(task.id)
    .find(c => c.period === previous.id);

  return !previousCompletion;
}


function getStatusClass(task) {
  const tab = getTab(task.tabId);

  if (!tab) {
    return "";
  }

  if (tab.mode === "one_time") {
    return "";
  }

  if (tab.mode === "repeatable") {
    return getLastCompletion(task) ? "green" : "";
  }

  if (getCurrentCompletion(task)) {
    return "green";
  }

  if (isOverdue(task)) {
    return "red";
  }

  return "";
}


/* =========================================================
   UI CREATION
========================================================= */

function createElement(tag, className, text) {
  const element = document.createElement(tag);

  if (className) {
    element.className = className;
  }

  if (text !== undefined) {
    element.textContent = text;
  }

  return element;
}


function createTaskElement(task) {
  const tab = getTab(task.tabId);
  const frequency = getFrequency(task.frequencyId);

  const card = createElement("div", "task-card");

  card.addEventListener("click", event => {
    if (event.target.closest(".task-menu")) {
      return;
    }

    if (tab?.mode === "one_time" && getLastCompletion(task)) {
      return;
    }

    openCompletionModal(task.id);
  });

  const status = createElement(
    "div",
    "task-status " + getStatusClass(task)
  );

  const content = createElement("div", "task-content");

  const title = createElement("div", "task-title", task.title);
  content.appendChild(title);

  const meta = createElement("div", "task-meta");

  if (tab?.hasFrequency && frequency) {
    meta.textContent = frequency.name;
  } else if (tab?.mode === "one_time") {
    meta.textContent = "Eenmalige taak";
  } else if (getLastCompletion(task)) {
    meta.textContent =
      "Laatst gedaan: " +
      formatDate(getLastCompletion(task).completedAt);
  }

  if (meta.textContent) {
    content.appendChild(meta);
  }

  card.appendChild(status);
  card.appendChild(content);

  if (tab?.hasPoints && task.points > 0) {
    card.appendChild(
      createElement("div", "task-points", "+" + task.points)
    );
  }

  const menu = createElement("button", "task-menu", "⋯");

  menu.addEventListener("click", event => {
    event.stopPropagation();
    openTaskEditor(task.id);
  });

  card.appendChild(menu);

  return card;
}

function renderViews() {
  const container = document.getElementById("views");
  container.innerHTML = "";

  settings.tabs.forEach(tab => {
    const view = createElement(
      "section",
      "view" + (currentView === tab.id ? " active" : "")
    );

    view.id = "view-" + tab.id;

      "div",
      "page-title",
      tab.icon + " " + tab.name

    });

    header.appendChild(addButton);

      list.appendChild(
        createElement(
          "div",
          "empty",
          "Nog geen taken in dit tabblad."
        )
      );
    } else if (tab.hasFrequency) {
      renderScheduledTasks(list, tabTasks);
    } else {
      tabTasks.forEach(task => {
        list.appendChild(createTaskElement(task));
      });
    }

    view.appendChild(list);
    container.appendChild(view);
  });

  renderTabs();
}


function renderScheduledTasks(container, tabTasks) {
  const grouped = {};

  tabTasks.forEach(task => {
    const frequency = getFrequency(task.frequencyId);
    const key = task.frequencyId || "unknown";

    if (!grouped[key]) {
      grouped[key] = {
        frequency,
        tasks: []
      };
    }

    grouped[key].tasks.push(task);
  });

  Object.values(grouped)
    .sort((a,b) => {
      const ai = settings.frequencies.indexOf(a.frequency);
      const bi = settings.frequencies.indexOf(b.frequency);
      return ai - bi;
    })
    .forEach(group => {
      const section = createElement("div", "frequency-section");

      const title = createElement(
        "div",
        "frequency-title",
        group.frequency
          ? group.frequency.name
          : "Geen frequentie"
      );

      const list = createElement("div", "task-list");

      group.tasks.forEach(task => {
        list.appendChild(createTaskElement(task));
      });

      section.appendChild(title);
      section.appendChild(list);

      container.appendChild(section);
    });
}

   ADD / DELETE CONFIG
========================================================= */

function addNewTab() {
  const id = crypto.randomUUID();

  settings.tabs.push({
    id,
    name: "Nieuw tabblad",
    icon: "📋",
    mode: "repeatable",
    hasFrequency: false,
    hasPoints: false
  });

  saveAll();
  renderAll();
}


function deleteTab(tabId) {
  if (settings.tabs.length <= 1) {
    alert("Je moet minstens één tabblad behouden.");
    return;
  }

  const tab = getTab(tabId);

  const affected = tasks.filter(
    task => task.tabId === tabId
  );

  if (affected.length) {
    const confirmed = confirm(
      `"${tab.name}" bevat ${affected.length} taak/taken. ` +
      "Als je dit tabblad verwijdert, worden deze taken ook verwijderd. Doorgaan?"
    );

    if (!confirmed) {
      return;
    }

    const ids = new Set(affected.map(task => task.id));

    tasks = tasks.filter(
      task => !ids.has(task.id)
    );

    completions = completions.filter(
      completion => !ids.has(completion.taskId)
    );
  }

  settings.tabs = settings.tabs.filter(
    tab => tab.id !== tabId
  );

  if (currentView === tabId) {
    currentView = settings.tabs[0].id;
  }

  saveAll();
  renderAll();
}


function addNewFrequency() {
  settings.frequencies.push({
    id: crypto.randomUUID(),
    name: "Nieuwe frequentie",
    unit: "week",
    interval: 1
  });

  saveAll();
  renderAll();
}


function deleteFrequency(frequencyId) {
  const used = tasks.some(
    task => task.frequencyId === frequencyId
  );

  if (used) {
    alert(
      "Deze frequentie wordt nog gebruikt door één of meer taken. " +
      "Pas eerst de frequentie van die taken aan."
    );

    return;
  }

  settings.frequencies =
    settings.frequencies.filter(
      frequency => frequency.id !== frequencyId
    );

  saveAll();
  renderAll();
}

   TASK EDITOR
========================================================= */

function openTaskEditor(taskId = null, tabId = null) {
  editingTaskId = taskId;

  const modal = document.getElementById("taskModal");

  const titleInput = document.getElementById("taskTitle");
  const frequencyField = document.getElementById("taskFrequencyField");
  const pointsField = document.getElementById("taskPointsField");
  const frequencySelect = document.getElementById("taskFrequency");
  const pointsInput = document.getElementById("taskPoints");

  let task = taskId ? getTask(taskId) : null;

  if (task) {
    tabId = task.tabId;
  }

  editingTabId = tabId || settings.tabs[0].id;

  const tab = getTab(editingTabId);

  if (!tab) {
    return;
  }

  document.getElementById("taskModalTitle").textContent =
    task ? "Taak bewerken" : "Nieuwe taak";

  titleInput.value = task?.title || "";

  frequencySelect.innerHTML = "";

  settings.frequencies.forEach(frequency => {
    const option = document.createElement("option");
    option.value = frequency.id;
    option.textContent = frequency.name;

    if (
      task?.frequencyId === frequency.id ||
      (!task && frequency.id === settings.frequencies[0]?.id)
    ) {
      option.selected = true;
    }

    frequencySelect.appendChild(option);
  });

  frequencyField.classList.toggle(
    "hidden",
    !tab.hasFrequency
  );

  pointsField.classList.toggle(
    "hidden",
    !tab.hasPoints
  );

  pointsInput.value = task?.points ?? 1;

  document.getElementById("deleteTask")
    .classList.toggle("hidden", !task);

  modal.classList.add("open");
}


function saveTaskFromModal() {
  const title =
    document.getElementById("taskTitle")
      .value.trim();

  if (!title) {
    alert("Geef de taak een naam.");
    return;
  }

  const tab = getTab(editingTabId);

  if (!tab) {
    return;
  }

  const frequencyId = tab.hasFrequency
    ? document.getElementById("taskFrequency").value || null
    : null;

  const points = tab.hasPoints
    ? Math.max(
        0,
        Number(
          document.getElementById("taskPoints").value
        ) || 0
      )
    : 0;

  if (editingTaskId) {
    const task = getTask(editingTaskId);

    if (!task) {
      return;
    }

    task.title = title;
    task.tabId = editingTabId;
    task.frequencyId = frequencyId;
    task.points = points;

  } else {
    tasks.push({
      id: crypto.randomUUID(),
      title,
      tabId: editingTabId,
      frequencyId,
      points,
      createdAt: new Date().toISOString()
    });
  }

  saveAll();
  closeTaskModal();
  renderAll();
}


function deleteEditingTask() {
  if (!editingTaskId) {
    return;
  }

  const task = getTask(editingTaskId);

  if (!task) {
    return;
  }

  if (!confirm(`"${task.title}" verwijderen?`)) {
    return;
  }

  tasks = tasks.filter(
    task => task.id !== editingTaskId
  );

  completions = completions.filter(
    completion => completion.taskId !== editingTaskId
  );

  saveAll();
  closeTaskModal();
  renderAll();
}


function closeTaskModal() {
  document.getElementById("taskModal")
    .classList.remove("open");

  editingTaskId = null;
  editingTabId = null;
}


/* =========================================================
   COMPLETION
========================================================= */

function openCompletionModal(taskId) {
  const task = getTask(taskId);

  if (!task) {
    return;
  }

  const tab = getTab(task.tabId);

  if (tab?.mode === "scheduled") {
    if (getCurrentCompletion(task)) {
      return;
    }
  }

  if (tab?.mode === "one_time" && getLastCompletion(task)) {
    return;
  }

  completionTaskId = taskId;

  document.getElementById("completionTitle").textContent =
    task.title;

  document.getElementById("completeYou").textContent =
    "👤 " + settings.youName;

  document.getElementById("completePartner").textContent =
    "👤 " + settings.partnerName;

  document.getElementById("completionModal")
    .classList.add("open");
}


function completeTask(person) {
  const task = getTask(completionTaskId);

  if (!task) {
    return;
  }

  const tab = getTab(task.tabId);

  if (!tab) {
    return;
  }

  if (tab.mode === "scheduled" && getCurrentCompletion(task)) {
    closeCompletionModal();
    return;
  }

  if (tab.mode === "one_time" && getLastCompletion(task)) {
    closeCompletionModal();
    return;
  }

  const periodInfo =
    tab.hasFrequency
      ? getPeriodInfo(task)
      : null;

  completions.push({
    id: crypto.randomUUID(),
    taskId: task.id,
    taskTitle: task.title,
    person,
    points: tab.hasPoints ? task.points : 0,
    period: periodInfo?.id || null,
    completedAt: new Date().toISOString()
  });

  // Eenmalige taken verdwijnen uit de actieve lijst.
  if (tab.mode === "one_time") {
    tasks = tasks.filter(
      item => item.id !== task.id
    );
  }

  saveAll();
  closeCompletionModal();
  renderAll();
}


function closeCompletionModal() {
  document.getElementById("completionModal")
    .classList.remove("open");

  completionTaskId = null;
}


/* =========================================================
   NAVIGATION
========================================================= */

function showView(viewId) {
  currentView = viewId;

  renderAll();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  closeMenu();
}


function renderAll() {
  renderViews();
  renderPoints();
  renderHistory();
  renderSettings();
}


/* =========================================================
   MENU
========================================================= */

function openMenu() {
  document.getElementById("menuOverlay")
    .classList.add("open");
}


function closeMenu() {
  document.getElementById("menuOverlay")
    .classList.remove("open");
}


/* =========================================================
   EVENTS
========================================================= */

document.getElementById("menuButton")
  .addEventListener("click", openMenu);

document.getElementById("closeMenu")
  .addEventListener("click", closeMenu);

document.getElementById("menuOverlay")
  .addEventListener("click", event => {
    if (event.target === event.currentTarget) {
      closeMenu();
    }
  });

document.querySelectorAll("[data-menu-view]")
  .forEach(button => {
    button.addEventListener("click", () => {
      showView(button.dataset.menuView);
    });
  });

document.getElementById("cancelCompletion")
  .addEventListener("click", closeCompletionModal);

document.getElementById("completeYou")
  .addEventListener("click", () => completeTask("you"));

document.getElementById("completePartner")
  .addEventListener(
    "click",
    () => completeTask("partner")
  );

document.getElementById("completeTogether")
  .addEventListener(
    "click",
    () => completeTask("together")
  );

document.getElementById("saveTask")
  .addEventListener("click", saveTaskFromModal);

document.getElementById("cancelTask")
  .addEventListener("click", closeTaskModal);

document.getElementById("deleteTask")
  .addEventListener("click", deleteEditingTask);

document.getElementById("completionModal")
  .addEventListener("click", event => {
    if (event.target === event.currentTarget) {
      closeCompletionModal();
    }
  });

document.getElementById("taskModal")
  .addEventListener("click", event => {
    if (event.target === event.currentTarget) {
      closeTaskModal();
    }
  });


/* =========================================================
   INIT
========================================================= */

loadData();

currentView =
  settings.tabs[0]?.id || "tab-recurring";

renderAll();

</script>

</body>
</html>
