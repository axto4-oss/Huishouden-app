<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,

body {

button,

.hidden {

}

/* =========================================================
   AUTH
========================================================= */

#authScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.auth-card {
  width: 100%;

  background: white;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 10px 35px rgba(0,0,0,.08);
}

.auth-title {
  margin: 0 0 8px;
  font-size: 30px;
  font-weight: 800;
}

.auth-subtitle {
  margin: 0 0 24px;
  color: #6b7280;
}

.auth-mode {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  background: #f1f3f5;
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
}

.auth-mode button {
  border: 0;
  border-radius: 9px;
  background: transparent;
  padding: 10px;
  color: #666;
}

.auth-mode button.active {
  background: white;
  color: #111;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.auth-field {
  margin-bottom: 15px;
}

.auth-field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

.auth-field input {

  border: 1px solid #d8dce2;
  border-radius: 12px;
  padding: 13px 14px;

}

.auth-field input:focus {
  border-color: #7b61ff;
}

.auth-submit {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 14px;
  background: #202124;
  color: white;
  font-weight: 700;
}

.auth-message {

  border-radius: 10px;
  padding: 11px 13px;
  font-size: 14px;
}

.auth-error {
  background: #fff0f0;
  color: #a40000;
}

.auth-info {
  background: #eef5ff;
  color: #24558c;
}

/* =========================================================
   LOADING
========================================================= */

#loadingScreen {

  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
}

/* =========================================================
   APP
========================================================= */

#app {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;

}

.topbar-inner {

  margin: auto;

.brand {

}

.brand-title {

.brand-subtitle {

.menu-button {

}

.sync-status {

/* =========================================================
   CONTENT
========================================================= */

.main-container {

}

.tabs {

.tab-button {

.tab-button.active {

.tab-view {

.section-card {

.tab-heading {

.tab-heading h2 {

.add-task-button,

.task-list {

.task-card {

.task-main {

.task-title {

.task-meta {

.task-actions {

.small-button {

}

.complete-button {

}

.empty-state {
  padding: 28px 10px;

}

/* =========================================================
   SCREENS
========================================================= */

.secondary-screen {

}

.secondary-screen.active {

}

.screen-title {

/* =========================================================

========================================================= */

.points-grid {

.points-card {

/* =========================================================

.history-item {

.tab-settings-header h4 {

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 0;
  border-top: 1px solid #eee;
}

.switch-row:first-of-type {
  border-top: 0;
}

.switch-label {
  font-weight: 650;
}

.switch {
  position: relative;
  width: 48px;
  height: 28px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  background: #d5d8dd;
  border-radius: 30px;
  transition: .2s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  top: 3px;
  border-radius: 50%;
  background: white;
  transition: .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}

.switch input:checked + .slider {
  background: #202124;
}

.switch input:checked + .slider:before {
  transform: translateX(20px);
}

.frequency-wrapper {
  margin-top: 12px;
}

.frequency-row {
  border: 1px solid #e3e5e8;
  border-radius: 13px;

.frequency-grid {

========================================================= */

#toast {
  position: fixed;
  left: 50%;

  color: white;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
  z-index: 500;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);

/* =========================================================

@media (max-width: 650px) {

    width: 100%;
  }

  .task-card {
    align-items: flex-start;
  }

  .task-actions {
    flex-direction: column;
  }
}
</style>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://cvfxltgvrovlkpphedcx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_-tgsq_QgUVGYOzQazMTBXQ_ih2h9Ufu";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   CONSTANTS
========================================================= */

const STORAGE_KEYS = {
  config: "huishouden_config",
  subtitle: "huishouden_subtitle"
};


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let householdId = null;

let config = createDefaultConfig();
let completions = [];

let currentTabId = null;
let selectedTask = null;

let editingTaskId = null;
let editorTabId = null;

let realtimeChannel = null;
let refreshTimer = null;

let loadingData = false;
let startInProgress = false;

/*
  Tijdens een eigen write willen we voorkomen dat een realtime
  event de lokale UI meteen terugzet naar een oudere toestand.
*/
let localWriteDepth = 0;
let realtimeIgnoreUntil = 0;


/* =========================================================
   HELPERS
========================================================= */

function createId() {
  if (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ) {
    return window.crypto.randomUUID();
  }

  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
    /[xy]/g,
    character => {
      const random =
        Math.random() * 16 | 0;

      const value =
        character === "x"
          ? random
          : (random & 0x3) | 0x8;

      return value.toString(16);
    }
  );
}


function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function showToast(message) {
  const toast =
    document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () => {
        toast.classList.remove("show");
      },
      2600
    );
}


function setSyncStatus(message) {
  const element =
    document.getElementById("syncStatus");

  if (element) {
    element.textContent = message;
  }
}


function beginLocalWrite() {
  localWriteDepth++;

  realtimeIgnoreUntil =
    Date.now() + 1200;
}


function endLocalWrite() {
  localWriteDepth =
    Math.max(
      0,
      localWriteDepth - 1
    );

  realtimeIgnoreUntil =
    Date.now() + 500;
}


function shouldIgnoreRealtime() {
  return (
    localWriteDepth > 0 ||
    Date.now() < realtimeIgnoreUntil
  );
}


async function withLocalWrite(
  callback
) {
  beginLocalWrite();

  try {
    return await callback();
  } finally {
    endLocalWrite();
  }
}


/* =========================================================
   DEFAULT CONFIG

/* =========================================================
   NORMALIZATION
========================================================= */

function normalizeFrequency(frequency) {
  return {
    id:
      frequency?.id ||
      createId(),

    name:
      frequency?.name ||
      makeFrequencyName(
        frequency?.unit || "weeks",
        Number(
          frequency?.interval ??
          frequency?.amount ??
          1
        )
      ),

    unit:
      frequency?.unit ||
      "weeks",

    interval:
      Math.max(
        1,
        Number(
          frequency?.interval ??
          frequency?.amount ??
          1
        )
      )
  };
}


function normalizeTask(task) {
  return {
    id:
      task?.id ||
      createId(),

    title:
      task?.title ||
      "Nieuwe taak",

    frequencyId:
      task?.frequencyId ??
      task?.frequency_id ??
      null,

    points:
      Math.max(
        0,
        Number(
          task?.points || 0
        )
      )
  };
}


function normalizeConfig(input) {
  const source =
    input ||
    createDefaultConfig();

  return {
    appName:
      source.appName ||
      "Huishouden",

    appSubtitle:
      source.appSubtitle ||
      "Taken overzicht",

    youName:
      source.youName ||
      "Jij",

    partnerName:
      source.partnerName ||
      "Partner",

    startDate:
      source.startDate ||
      "",

    tabs:
      (source.tabs || []).map(
        tab => ({
          id:
            tab.id ||
            createId(),

          name:
            tab.name ||
            "Tab",

          icon:
            tab.icon ||
            "📌",

          pointsEnabled:
            tab.pointsEnabled !== false,

          frequencyEnabled:
            tab.frequencyEnabled === true,

          frequencies:
            (tab.frequencies || [])
              .map(normalizeFrequency),

          tasks:
            (tab.tasks || [])
              .map(normalizeTask)
        })
      )
  };
}


/* =========================================================
   LOCAL CACHE
========================================================= */

function saveLocalCache() {
  try {
    localStorage.setItem(
      STORAGE_KEYS.config,
      JSON.stringify(config)
    );
  } catch (error) {
    console.warn(
      "Local cache opslaan mislukt:",
      error
    );
  }
}


function loadLocalConfig() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEYS.config
      );

    if (!raw) {
      return null;
    }

    return normalizeConfig(
      JSON.parse(raw)
    );
  } catch (error) {
    console.warn(
      "Local cache lezen mislukt:",
      error
    );

    return null;
  }
}


/* =========================================================
   FREQUENCIES
========================================================= */

function makeFrequencyName(
  unit,
  interval
) {
  const number =
    Math.max(
      1,
      Number(interval) || 1
    );

  if (unit === "days") {
    return number === 1
      ? "Elke dag"
      : `Elke ${number} dagen`;
  }

  if (unit === "months") {
    return number === 1
      ? "Elke maand"
      : `Elke ${number} maanden`;
  }

  return number === 1
    ? "Elke week"
    : `Elke ${number} weken`;
}


function getFrequencyLabel(
  frequency
) {
  return (
    frequency?.name ||
    makeFrequencyName(
      frequency?.unit,
      frequency?.interval
    )
  );
}


function getFrequencyById(
  frequencyId
) {
  if (!frequencyId) {
    return null;
  }

  for (
    const tab of config.tabs
  ) {
    const frequency =
      tab.frequencies.find(
        item =>
          item.id ===
          frequencyId
      );

    if (frequency) {
      return frequency;
    }
  }

  return null;
}


/*
  Belangrijk:
  de Supabase-tabel frequencies heeft géén tab_id.
  Daarom behandelen we frequenties als household-brede
  frequenties. Elke tab die frequenties gebruikt krijgt
  dezelfde lijst te zien.

  Dit voorkomt dat de ene browser een frequentie wel ziet
  en de andere browser niet.
*/
function applyHouseholdFrequencies(
  frequencyRows
) {
  const normalized =
    (frequencyRows || [])
      .filter(
        row =>
          row.enabled !== false
      )
      .sort(
        (a, b) =>
          Number(a.position || 0) -
          Number(b.position || 0)
      )
      .map(
        row =>
          normalizeFrequency({
            id: row.id,
            name: row.name,
            amount: row.amount,
            unit: row.unit
          })
      );

  config.tabs.forEach(
    tab => {
      if (tab.frequencyEnabled) {
        tab.frequencies =
          normalized.map(
            frequency => ({
              ...frequency
            })
          );
      } else {
        tab.frequencies = [];
      }
    }
  );
}


/* =========================================================
   DATE / PERIOD
========================================================= */

function getTodayKey() {
  const date =
    new Date();

  return [
    date.getFullYear(),
    String(
      date.getMonth() + 1
    ).padStart(2, "0"),
    String(
      date.getDate()
    ).padStart(2, "0")
  ].join("-");
}


function getWeekKey(date = new Date()) {
  const d =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

  const day =
    d.getDay() || 7;

  d.setDate(
    d.getDate() -
    day +
    1
  );

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth() + 1
    ).padStart(2, "0");

  const dayNumber =
    String(
      d.getDate()
    ).padStart(2, "0");

  return `${year}-W${month}-${dayNumber}`;
}


function getPeriodKey() {
  return getWeekKey();
}


function getDateFromCompletion(
  completion
) {
  if (!completion?.completedAt) {
    return "";
  }

  const date =
    new Date(
      completion.completedAt
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "";
  }

  return date.toLocaleDateString(
    "nl-BE",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );
}


/* =========================================================
   COMPLETION / STATUS
========================================================= */

function findTabIdForTask(
  taskId
) {
  for (
    const tab of config.tabs
  ) {
    if (
      tab.tasks.some(
        task =>
          task.id === taskId
      )
    ) {
      return tab.id;
    }
  }

  return null;
}


function getTaskById(
  taskId
) {
  for (
    const tab of config.tabs
  ) {
    const task =
      tab.tasks.find(
        item =>
          item.id === taskId
      );

    if (task) {
      return {
        tab,
        task
      };
    }
  }

  return null;
}


function getCompletionsForTask(
  taskId
) {
  return completions.filter(
    completion =>
      completion.taskId ===
      taskId
  );
}


function isTaskCompletedToday(
  taskId
) {
  const today =
    getTodayKey();

  return completions.some(
    completion =>
      completion.taskId === taskId &&
      String(
        completion.completedAt || ""
      ).slice(0, 10) === today
  );
}


/* =========================================================
   POINTS
========================================================= */

function getPointsTotals() {
  let you = 0;
  let partner = 0;

  completions.forEach(
    completion => {
      const points =
        Number(
          completion.points || 0
        );

      if (
        completion.person ===
        "you"
      ) {
        you += points;
      }

      if (
        completion.person ===
        "partner"
      ) {
        partner += points;
      }

      if (
        completion.person ===
        "together"
      ) {
        you += points;
        partner += points;
      }
    }
  );

  return {
    you,
    partner
  };
}


/* =========================================================
   DATABASE: FIND HOUSEHOLD
========================================================= */

async function findHouseholdForCurrentUser() {
  if (!currentUser) {
    return null;
  }

  const result =
    await supabaseClient
      .from("household_members")
      .select("household_id")
      .eq(
        "user_id",
        currentUser.id
      )
      .limit(1);

  if (result.error) {
    throw result.error;
  }

  if (
    result.data &&
    result.data.length
  ) {
    return result.data[0].household_id;
  }

  const accessResult =
    await supabaseClient
      .from("household_user_access")
      .select("household_id")
      .eq(
        "user_id",
        currentUser.id
      )
      .limit(1);

  if (accessResult.error) {
    throw accessResult.error;
  }

  return (
    accessResult.data?.[0]?.household_id ||
    null
  );
}


/* =========================================================
   DATABASE: REBUILD
========================================================= */

function rebuildConfigFromRows(
  households,
  settings,
  tabs,
  frequencies,
  tasks
) {
  const current =
    config ||
    createDefaultConfig();

  const household =
    households?.[0];

  const setting =
    settings?.[0];

  const tabRows =
    (tabs || [])
      .slice()
      .sort(
        (a, b) =>
          Number(a.position || 0) -
          Number(b.position || 0)
      );

  const taskRows =
    tasks || [];

  const result = {
    appName:
      household?.name ||
      current.appName ||
      "Huishouden",

    appSubtitle:
      current.appSubtitle ||
      "Taken overzicht",

    youName:
      setting?.you_name ||
      current.youName ||
      "Jij",

    partnerName:
      setting?.partner_name ||
      current.partnerName ||
      "Partner",

    startDate:
      setting?.start_date ||
      current.startDate ||
      "",

    tabs:
      tabRows.map(
        tabRow => {
          const oldTab =
            current.tabs.find(
              tab =>
                tab.id ===
                tabRow.id
            );

          return {
            id:
              tabRow.id,

            name:
              tabRow.name ||
              oldTab?.name ||
              "Tab",

            icon:
              tabRow.icon ||
              oldTab?.icon ||
              "📌",

            pointsEnabled:
              tabRow.use_points !== false,

            frequencyEnabled:
              tabRow.use_frequency === true,

            frequencies:
              [],

            tasks:
              taskRows
                .filter(
                  task =>
                    task.tab_id ===
                    tabRow.id
                )
                .map(
                  task => ({
                    id:
                      task.id,

                    title:
                      task.title,

                    frequencyId:
                      task.frequency_id,

                    points:
                      Number(
                        task.points || 0
                      )
                  })
                )
          };
        }
      )
  };

  return normalizeConfig(
    result
  );
}


/* =========================================================
   DATABASE: LOAD
========================================================= */

async function loadHouseholdData() {
  if (
    loadingData ||
    !currentUser
  ) {
    return;
  }

  loadingData = true;

  try {
    setSyncStatus(
      "Gegevens laden…"
    );

    householdId =
      await findHouseholdForCurrentUser();

    if (!householdId) {
      throw new Error(
        "Je account is nog niet aan een huishouden gekoppeld."
      );
    }

    const [
      householdResult,
      settingsResult,
      tabsResult,
      frequenciesResult,
      tasksResult,
      completionsResult
    ] =
      await Promise.all([
        supabaseClient
          .from("households")
          .select("*")
          .eq(
            "id",
            householdId
          ),

        supabaseClient
          .from("household_settings")
          .select("*")
          .eq(
            "household_id",
            householdId
          ),

        supabaseClient
          .from("tabs")
          .select("*")
          .eq(
            "household_id",
            householdId
          )
          .order(
            "position",
            {
              ascending: true
            }
          ),

        supabaseClient
          .from("frequencies")
          .select("*")
          .eq(
            "household_id",
            householdId
          )
          .order(
            "position",
            {
              ascending: true
            }
          ),

        supabaseClient
          .from("tasks")
          .select("*")
          .eq(
            "household_id",
            householdId
          ),

        supabaseClient
          .from("completions")
          .select("*")
          .eq(
            "household_id",
            householdId
          )
          .order(
            "completed_at",
            {
              ascending: false
            }
          )
      ]);

    const results = [
      householdResult,
      settingsResult,
      tabsResult,
      frequenciesResult,
      tasksResult,
      completionsResult
    ];

    const failed =
      results.find(
        result =>
          result.error
      );

    if (failed) {
      throw failed.error;
    }

    /*
      Als de database nog helemaal leeg is, migreren we de
      lokale configuratie één keer.
    */
    const hasTabs =
      (tabsResult.data || []).length > 0;

    if (!hasTabs) {
      const local =
        loadLocalConfig();

      if (
        local &&
        local.tabs?.length
      ) {
        config =
          local;

        await migrateLocalData();

        /*
          Na migratie opnieuw laden zodat de database
          de definitieve bron is.
        */
        loadingData = false;

        return await loadHouseholdData();
      }
    }

    config =
      rebuildConfigFromRows(
        householdResult.data,
        settingsResult.data,
        tabsResult.data,
        frequenciesResult.data,
        tasksResult.data
      );

    /*
      Frequenties zijn household-breed omdat de bestaande
      tabel geen tab_id bevat.
    */
    applyHouseholdFrequencies(
      frequenciesResult.data
    );

    completions =
      (completionsResult.data || [])
        .map(
          mapCompletionFromDb
        );

    const storedSubtitle =
      localStorage.getItem(
        STORAGE_KEYS.subtitle
      );

    if (storedSubtitle) {
      config.appSubtitle =
        storedSubtitle;
    }

    currentTabId =
      config.tabs[0]?.id ||
      null;

    saveLocalCache();

    setSyncStatus(
      "Gesynchroniseerd"
    );

  } finally {
    loadingData = false;
  }
}


/* =========================================================
   DATABASE: MIGRATION
========================================================= */

async function migrateLocalData() {
  if (
    !householdId
  ) {
    return;
  }

  const local =
    config ||
    createDefaultConfig();

  await withLocalWrite(
    async () => {

      for (
        let index = 0;
        index < local.tabs.length;
        index++
      ) {
        await saveTabToDb(
          local.tabs[index],
          index
        );
      }

      /*
        Frequenties zijn household-breed.
        Dubbele IDs worden maar één keer opgeslagen.
      */
      const frequencies =
        new Map();

      local.tabs.forEach(
        tab => {
          (tab.frequencies || [])
            .forEach(
              frequency => {
                frequencies.set(
                  frequency.id,
                  frequency
                );
              }
            );
        }
      );

      let frequencyIndex = 0;

      for (
        const frequency of frequencies.values()
      ) {
        await saveFrequencyToDb(
          null,
          frequency,
          frequencyIndex++
        );
      }

      for (
        const tab of local.tabs
      ) {
        for (
          const task of tab.tasks
        ) {
          await saveTaskToDb(
            tab,
            task
          );
        }
      }

      await saveHouseholdName();
      await saveHouseholdSettings();

      for (
        const completion of completions
      ) {
        await saveCompletionToDb(
          completion
        );
      }
    }
  );
}

/* =========================================================
   RENDER
========================================================= */

function render() {
  renderHeader();
  renderTabs();
  renderTabViews();
}


function renderHeader() {
  document.getElementById(
    "appTitle"
  ).textContent =
    config.appName;

  document.getElementById(
    "appSubtitle"
  ).textContent =
    config.appSubtitle;
}


function renderTabs() {
  const container =
    document.getElementById(
      "tabs"
    );

  container.innerHTML = "";

  config.tabs.forEach(
    tab => {
      const button =
        document.createElement(
          "button"
        );

      button.type = "button";

      button.className =
        "tab-button" +
        (
          tab.id === currentTabId
            ? " active"
            : ""
        );

      button.textContent =
        `${tab.icon} ${tab.name}`;

      button.onclick =
        () => {
          currentTabId =
            tab.id;

          render();
        };

      container.appendChild(
        button
      );
    }
  );
}


function renderTabViews() {
  const container =
    document.getElementById(
      "tabViews"
    );

  container.innerHTML = "";

  config.tabs.forEach(
    tab => {

      const view =
        document.createElement(
          "div"
        );

      view.className =
        "tab-view" +
        (
          tab.id === currentTabId
            ? " active"
            : ""
        );

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "section-card";

      const heading =
        document.createElement(
          "div"
        );

      heading.className =
        "tab-heading";

      const title =
        document.createElement(
          "h2"
        );

      title.textContent =

/* =========================================================
   TASK EDITOR
========================================================= */

function openTaskEditor(
  tabId,
  taskId = null
) {
  const tab =
    config.tabs.find(
      item =>
        item.id === tabId
    );

  if (!tab) {
    return;
  }

  editorTabId =
    tabId;

  editingTaskId =
    taskId;

  const task =
    taskId
      ? tab.tasks.find(
          item =>
            item.id === taskId
        )
      : null;

  document.getElementById(
    "taskEditorTitle"
  ).textContent =
    task
      ? "Taak aanpassen"
      : "Taak toevoegen";

  document.getElementById(
    "taskTitleInput"
  ).value =
    task?.title ||
    "";

  document.getElementById(
    "taskPointsInput"
  ).value =
    task?.points ??
    0;

  const frequencyInput =
    document.getElementById(
      "taskFrequencyInput"
    );

  frequencyInput.innerHTML =
    "";

  const frequencies =
    tab.frequencies || [];

  frequencies.forEach(
    frequency => {
      const option =
        document.createElement(
          "option"
        );

      option.value =
        frequency.id;

      option.textContent =
        getFrequencyLabel(
          frequency
        );

      if (
        task?.frequencyId ===
        frequency.id
      ) {
        option.selected =
          true;
      }

      frequencyInput.appendChild(
        option
      );
    }
  );

  const frequencyField =
    document.getElementById(
      "taskFrequencyField"
    );

  frequencyField.style.display =
    tab.frequencyEnabled &&
    frequencies.length
      ? "block"
      : "none";

  const pointsField =
    document.getElementById(
      "taskPointsField"
    );

  pointsField.style.display =
    tab.pointsEnabled
      ? "block"
      : "none";

  document
    .getElementById(
      "taskEditorModal"
    )
    .classList.add(
      "show"
    );

  setTimeout(
    () =>
      document
        .getElementById(
          "taskTitleInput"
        )
        .focus(),
    50
  );
}


function closeTaskEditor() {
  document
    .getElementById(
      "taskEditorModal"
    )
    .classList.remove(
      "show"
    );

  editingTaskId =
    null;

  editorTabId =
    null;
}


async function saveTaskFromEditor() {
  const tab =
    config.tabs.find(
      item =>
        item.id ===
        editorTabId
    );

  if (!tab) {
    return;
  }

  const title =
    document.getElementById(
      "taskTitleInput"
    ).value.trim();

  if (!title) {
    showToast(
      "Vul eerst een taaknaam in."
    );

    return;
  }

  let points =
    Number(
      document.getElementById(
        "taskPointsInput"
      ).value
    );

  if (
    !Number.isFinite(points) ||
    points < 0
  ) {
    points = 0;
  }

  points =
    Math.floor(points);

  const frequencyInput =
    document.getElementById(
      "taskFrequencyInput"
    );

  const frequencyId =
    tab.frequencyEnabled
      ? (
          frequencyInput.value ||
          null
        )
      : null;

  const oldTask =
    editingTaskId
      ? tab.tasks.find(
          task =>
            task.id ===
            editingTaskId
        )
      : null;

  const newTask = {
    id:
      editingTaskId ||
      createId(),

    title,

    frequencyId,

    points
  };

  try {

    setSyncStatus(
      "Taak opslaan…"
    );

    await withLocalWrite(
      async () => {
        await saveTaskToDb(
          tab,
          newTask
        );

        if (oldTask) {

          const index =
            tab.tasks.findIndex(
              task =>
                task.id ===
                oldTask.id
            );

          if (index >= 0) {
            tab.tasks[index] =
              newTask;
          }

        } else {

          tab.tasks.push(
            newTask
          );

        }
      }
    );

    saveLocalCache();

    closeTaskEditor();

    render();

    setSyncStatus(
      "Gesynchroniseerd"
    );

    showToast(
      oldTask
        ? "Taak aangepast."
        : "Taak toegevoegd."
    );

  } catch (error) {

    console.error(
      "Taak opslaan:",
      error
    );

    setSyncStatus(
      "Synchronisatiefout"
    );

    showToast(
      "Taak opslaan mislukt."
    );
  }
}


async function deleteTask(
  tab,
  task
) {
  if (
    !confirm(
      `Taak "${task.title}" verwijderen?`
    )
  ) {
    return;
  }

  const oldTasks =
    [...tab.tasks];

  try {

    await withLocalWrite(
      async () => {
        await deleteTaskFromDb(
          task.id
        );

        tab.tasks =
          tab.tasks.filter(
            item =>
              item.id !==
              task.id
          );
      }
    );

    saveLocalCache();

    render();

    showToast(
      "Taak verwijderd."
    );

  } catch (error) {

    tab.tasks =
      oldTasks;

    console.error(
      "Taak verwijderen:",
      error
    );

    showToast(
      "Taak verwijderen mislukt."
    );
  }
}

async function confirmCompletion() {
  if (!selectedTask) {
    return;
  }

  const {
    tab,
    task
  } =
    selectedTask;

  const person =
    document.getElementById(
      "completionPerson"
    ).value;

  const personName =
    person === "you"
      ? config.youName
      : person === "partner"
        ? config.partnerName
        : `${config.youName} + ${config.partnerName}`;

  const points =
    tab.pointsEnabled
      ? Number(
          task.points || 0
        )
      : 0;

  const now =
    new Date().toISOString();

  const completion = {
    id:
      createId(),

    taskId:
      task.id,

    taskTitle:
      task.title,

    person,

    personName,

    points,

    periodKey:
      getPeriodKey(),

    completedAt:
      now
  };

  try {

    await withLocalWrite(
      async () => {

        await saveCompletionToDb(
          completion
        );

        completions.unshift(
          completion
        );
      }
    );

    saveLocalCache();

    closeCompletionModal();

    render();

    showToast(
      "Taak afgerond."
    );

  } catch (error) {

    console.error(
      "Completion opslaan:",
      error
    );

    showToast(
      "Taak afronden mislukt."
    );
  }
}

/* =========================================================
   UNIQUE FREQUENCIES
========================================================= */

function getAllUniqueFrequencies() {
  const map =
    new Map();

  config.tabs.forEach(
    tab => {
      (tab.frequencies || [])
        .forEach(
          frequency => {
            if (
              !map.has(
                frequency.id
              )
            ) {
              map.set(
                frequency.id,
                {
                  ...frequency
                }
              );
            }
          }
        );
    }
  );

  return [
    ...map.values()
  ];
}


/* =========================================================
   FREQUENCY SETTINGS
========================================================= */

function renderFrequencySettings(
  tab,
  container
) {
  container.innerHTML =
    "";

  if (
    !tab.frequencyEnabled
  ) {
    return;
  }

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "frequency-wrapper";

  if (
    tab.frequencies.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty-state";

    empty.textContent =
      "Nog geen frequenties.";

    wrapper.appendChild(
      empty
    );
  }


  tab.frequencies.forEach(
    (
      frequency,
      frequencyIndex
    ) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "frequency-row";

      const grid =
        document.createElement(
          "div"
        );

      grid.className =
        "frequency-grid";


      /* Naam */

      const nameField =
        document.createElement(
          "div"
        );

      nameField.className =
        "field";

      const nameLabel =
        document.createElement(
          "label"
        );

      nameLabel.textContent =
        "Naam";

      const nameInput =
        document.createElement(
          "input"
        );

      nameInput.type =
        "text";

      nameInput.value =
        frequency.name;

      nameInput.onchange =
        async () => {

          const oldName =
            frequency.name;

          frequency.name =
            nameInput.value.trim() ||
            makeFrequencyName(
              frequency.unit,
              frequency.interval
            );

          try {

            await withLocalWrite(
              () =>
                saveFrequencyToDb(
                  tab,
                  frequency,
                  frequencyIndex
                )
            );

            syncFrequencyEverywhere(
              frequency
            );

            saveLocalCache();

            renderSettings();
            renderTabViews();

          } catch (error) {

            frequency.name =
              oldName;

            console.error(
              error
            );

            showToast(
              "Frequentie opslaan mislukt."
            );
          }
        };

      nameField.appendChild(
        nameLabel
      );

      nameField.appendChild(
        nameInput
      );


      /* Interval */

      const intervalField =
        document.createElement(
          "div"
        );

      intervalField.className =
        "field";

      const intervalLabel =
        document.createElement(
          "label"
        );

      intervalLabel.textContent =
        "Aantal";

      const intervalInput =
        document.createElement(
          "input"
        );

      intervalInput.type =
        "number";

      intervalInput.min =
        "1";

      intervalInput.max =
        "999";

      intervalInput.step =
        "1";

      intervalInput.value =
        frequency.interval;

      intervalInput.onchange =
        async () => {

          const oldInterval =
            frequency.interval;

          const oldName =
            frequency.name;

          let value =
            Math.floor(
              Number(
                intervalInput.value
              )
            );

          if (
            !Number.isFinite(value) ||
            value < 1
          ) {
            value = 1;
          }

          if (
            value > 999
          ) {
            value = 999;
          }

          frequency.interval =
            value;

          if (
            !oldName ||
            oldName.startsWith("Elke ")
          ) {
            frequency.name =
              makeFrequencyName(
                frequency.unit,
                value
              );
          }

          try {

            await withLocalWrite(
              () =>
                saveFrequencyToDb(
                  tab,
                  frequency,
                  frequencyIndex
                )
            );

            syncFrequencyEverywhere(
              frequency
            );

            saveLocalCache();

            renderSettings();
            renderTabViews();

          } catch (error) {

            frequency.interval =
              oldInterval;

            frequency.name =
              oldName;

            console.error(
              error
            );

            showToast(
              "Frequentie opslaan mislukt."
            );
          }
        };

      intervalField.appendChild(
        intervalLabel
      );

      intervalField.appendChild(
        intervalInput
      );


      /* Unit */

      const unitField =
        document.createElement(
          "div"
        );

      unitField.className =
        "field";

      const unitLabel =
        document.createElement(
          "label"
        );

      unitLabel.textContent =
        "Eenheid";

      const unitSelect =
        document.createElement(
          "select"
        );

      [
        {
          value: "days",
          label: "Dagen"
        },
        {
          value: "weeks",
          label: "Weken"
        },
        {
          value: "months",
          label: "Maanden"
        }
      ].forEach(
        optionData => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            optionData.value;

          option.textContent =
            optionData.label;

          option.selected =
            frequency.unit ===
            optionData.value;

          unitSelect.appendChild(
            option
          );
        }
      );

      unitSelect.onchange =
        async () => {

          const oldUnit =
            frequency.unit;

          const oldName =
            frequency.name;

          frequency.unit =
            unitSelect.value;

          if (
            !oldName ||
            oldName.startsWith("Elke ")
          ) {
            frequency.name =
              makeFrequencyName(
                frequency.unit,
                frequency.interval
              );
          }

          try {

            await withLocalWrite(
              () =>
                saveFrequencyToDb(
                  tab,
                  frequency,
                  frequencyIndex
                )
            );

            syncFrequencyEverywhere(
              frequency
            );

            saveLocalCache();

            renderSettings();
            renderTabViews();

          } catch (error) {

            frequency.unit =
              oldUnit;

            frequency.name =
              oldName;

            console.error(
              error
            );

            showToast(
              "Frequentie opslaan mislukt."
            );
          }
        };

      unitField.appendChild(
        unitLabel
      );

      unitField.appendChild(
        unitSelect
      );


      /* Remove */

      const removeButton =
        document.createElement(
          "button"
        );

      removeButton.type =
        "button";

      removeButton.className =
        "frequency-remove";

      removeButton.textContent =
        "×";

      removeButton.title =
        "Frequentie verwijderen";

      removeButton.onclick =
        async () => {

          const used =
            config.tabs.some(
              currentTab =>
                currentTab.tasks.some(
                  task =>
                    task.frequencyId ===
                    frequency.id
                )
            );

          if (used) {

            alert(
              "Deze frequentie wordt nog gebruikt door één of meerdere taken. Pas eerst die taken aan."
            );

            return;
          }

          if (
            !confirm(
              `Frequentie "${frequency.name}" verwijderen?`
            )
          ) {
            return;
          }

          try {

            await withLocalWrite(
              async () => {
                await deleteFrequencyFromDb(
                  frequency.id
                );

                config.tabs.forEach(
                  currentTab => {
                    currentTab.frequencies =
                      currentTab.frequencies.filter(
                        item =>
                          item.id !==
                          frequency.id
                      );
                  }
                );
              }
            );

            saveLocalCache();

            renderSettings();
            renderTabViews();

            showToast(
              "Frequentie verwijderd."
            );

          } catch (error) {

            console.error(
              error
            );

            showToast(
              "Frequentie verwijderen mislukt."
            );
          }
        };


      grid.appendChild(
        nameField
      );

      grid.appendChild(
        intervalField
      );

      grid.appendChild(
        unitField
      );

      grid.appendChild(
        removeButton
      );

      row.appendChild(
        grid
      );


      const example =
        document.createElement(
          "div"
        );

      example.className =
        "frequency-example";

      example.textContent =
        `Technisch interval: ${makeFrequencyName(
          frequency.unit,
          frequency.interval
        ).toLowerCase()}`;

      row.appendChild(
        example
      );

      wrapper.appendChild(
        row
      );
    }
  );


  /* Add */

  const addButton =
    document.createElement(
      "button"
    );

  addButton.type =
    "button";

  addButton.className =
    "add-frequency-button";

  addButton.textContent =
    "＋ Frequentie toevoegen";

  addButton.onclick =
    async () => {

      const frequency = {
        id:
          createId(),

        name:
          "Elke 1 week",

        unit:
          "weeks",

        interval:
          1
      };

      try {

        setSyncStatus(
          "Frequentie opslaan…"
        );

        await withLocalWrite(
          async () => {

            await saveFrequencyToDb(
              tab,
              frequency,
              getAllUniqueFrequencies().length
            );

            /*
              De nieuwe frequentie wordt aan alle tabs
              met frequenties toegevoegd.
            */
            config.tabs.forEach(
              currentTab => {
                if (
                  currentTab.frequencyEnabled
                ) {
                  currentTab.frequencies.push({
                    ...frequency
                  });
                }
              }
            );
          }
        );

        saveLocalCache();

        renderSettings();
        renderTabViews();

        setSyncStatus(
          "Gesynchroniseerd"
        );

        showToast(
          "Frequentie toegevoegd."
        );

      } catch (error) {

        console.error(
          "Frequentie toevoegen:",
          error
        );

        showToast(
          "Frequentie toevoegen mislukt."
        );

        setSyncStatus(
          "Synchronisatiefout"
        );
      }
    };

  wrapper.appendChild(
    addButton
  );

  container.appendChild(
    wrapper
  );
}


/*
  Zorgt ervoor dat een aangepaste household-frequentie
  overal in het lokale config-object dezelfde waarde heeft.
*/
function syncFrequencyEverywhere(
  changedFrequency
) {
  config.tabs.forEach(
    tab => {

      const frequency =
        tab.frequencies.find(
          item =>
            item.id ===
            changedFrequency.id
        );

      if (frequency) {

        frequency.name =
          changedFrequency.name;

        frequency.unit =
          changedFrequency.unit;

        frequency.interval =
          changedFrequency.interval;
      }
    }
  );
}


/* =========================================================
   ALL SETTINGS SAVE
========================================================= */

async function saveAllSettings() {
  const appName =
    document.getElementById(
      "settingsAppName"
    ).value.trim();

  const subtitle =
    document.getElementById(
      "settingsSubtitle"
    ).value.trim();

  const youName =
    document.getElementById(
      "settingsYouName"
    ).value.trim();

  const partnerName =
    document.getElementById(
      "settingsPartnerName"
    ).value.trim();

  const startDate =
    document.getElementById(
      "settingsStartDate"
    ).value;

  config.appName =
    appName ||
    "Huishouden";

  config.appSubtitle =
    subtitle ||
    "Taken overzicht";

  config.youName =
    youName ||
    "Jij";

  config.partnerName =
    partnerName ||
    "Partner";

  config.startDate =
    startDate ||
    "";


  config.tabs.forEach(
    (
      tab,
      index
    ) => {

      const nameInput =
        document.getElementById(
          `tabName${index}`
        );

      if (nameInput) {
        tab.name =
          nameInput.value.trim() ||
          `Tab ${index + 1}`;
      }

      const iconInput =
        document.getElementById(
          `tabIcon${index}`
        );

      if (iconInput) {
        tab.icon =
          iconInput.value.trim() ||
          "📌";
      }
    }
  );


  try {

    setSyncStatus(
      "Instellingen opslaan…"
    );

    localStorage.setItem(
      STORAGE_KEYS.subtitle,
      config.appSubtitle
    );

    await withLocalWrite(
      async () => {

        await saveHouseholdName();

        await saveHouseholdSettings();

        for (
          let index = 0;
          index < config.tabs.length;
          index++
        ) {

          await saveTabToDb(
            config.tabs[index],
            index
          );
        }

        /*
          Frequenties één keer per household opslaan.
        */
        const frequencies =
          getAllUniqueFrequencies();

        for (
          let index = 0;
          index < frequencies.length;
          index++
        ) {

          await saveFrequencyToDb(
            null,
            frequencies[index],
            index
          );
        }

        for (
          const tab of config.tabs
        ) {

          for (
            const task of tab.tasks
          ) {

            await saveTaskToDb(
              tab,
              task
            );
          }
        }
      }
    );

    saveLocalCache();

    render();

    setSyncStatus(
      "Gesynchroniseerd"
    );

    showToast(
      "Instellingen opgeslagen."
    );

  } catch (error) {

    console.error(
      "Instellingen opslaan:",
      error
    );

    setSyncStatus(
      "Synchronisatiefout"
    );

    alert(
      "De instellingen konden niet volledig worden opgeslagen."
    );
  }
}

/* =========================================================
   REALTIME
========================================================= */

function setupRealtime() {
  if (!householdId) {
    return;
  }

  if (realtimeChannel) {
    supabaseClient.removeChannel(
      realtimeChannel
    );

    realtimeChannel =
      null;
  }

  realtimeChannel =
    supabaseClient
      .channel(
        `household-${householdId}`
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "households",
          filter:
            `id=eq.${householdId}`
        },
        () =>
          scheduleRealtimeRefresh(
            "household"
          )
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "household_settings",
          filter:
            `household_id=eq.${householdId}`
        },
        () =>
          scheduleRealtimeRefresh(
            "settings"
          )
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "tabs",
          filter:
            `household_id=eq.${householdId}`
        },
        () =>
          scheduleRealtimeRefresh(
            "tabs"
          )
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "frequencies",
          filter:
            `household_id=eq.${householdId}`
        },
        () =>
          scheduleRealtimeRefresh(
            "frequencies"
          )
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "tasks",
          filter:
            `household_id=eq.${householdId}`
        },
        () =>
          scheduleRealtimeRefresh(
            "tasks"
          )
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "completions",
          filter:
            `household_id=eq.${householdId}`
        },
        () =>
          scheduleRealtimeRefresh(
            "completions"
          )
      )

      .subscribe(
        status => {

          if (
            status ===
            "SUBSCRIBED"
          ) {
            setSyncStatus(
              "Live synchronisatie"
            );
          }

          if (
            status ===
            "CHANNEL_ERROR"
          ) {
            setSyncStatus(
              "Realtime fout"
            );
          }

          if (
            status ===
            "TIMED_OUT"
          ) {
            setSyncStatus(
              "Realtime opnieuw verbinden…"
            );
          }
        }
      );
}


function scheduleRealtimeRefresh(
  reason
) {
  clearTimeout(
    refreshTimer
  );

  refreshTimer =
    setTimeout(
      async () => {

        if (
          shouldIgnoreRealtime() ||
          loadingData
        ) {
          return;
        }

        try {

          await loadHouseholdData();

          render();

        } catch (error) {

          console.error(
            `Realtime refresh (${reason}):`,
            error
          );

          setSyncStatus(
            "Synchronisatiefout"
          );
        }
      },
      250
    );
}


/* =========================================================
   AUTH
========================================================= */

let authMode =
  "login";


function setAuthMode(
  mode
) {
  authMode =
    mode;

  document
    .getElementById(
      "loginModeButton"
    )
    .classList.toggle(
      "active",
      mode === "login"
    );

  document
    .getElementById(
      "signupModeButton"
    )
    .classList.toggle(
      "active",
      mode === "signup"
    );

  document.getElementById(
    "authSubmit"
  ).textContent =
    mode === "login"
      ? "Inloggen"
      : "Account maken";

  hideAuthMessages();
}


function hideAuthMessages() {
  document
    .getElementById(
      "authError"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "authInfo"
    )
    .classList.add(
      "hidden"
    );
}


function showAuthError(
  message
) {
  const element =
    document.getElementById(
      "authError"
    );

  element.textContent =
    message;

  element.classList.remove(
    "hidden"
  );
}


function showAuthInfo(
  message
) {
  const element =
    document.getElementById(
      "authInfo"
    );

  element.textContent =
    message;

  element.classList.remove(
    "hidden"
  );
}


async function handleAuthSubmit() {
  hideAuthMessages();

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  if (!email) {
    showAuthError(
      "Vul je e-mailadres in."
    );

    return;
  }

  if (
    password.length < 6
  ) {
    showAuthError(
      "Het wachtwoord moet minstens 6 tekens bevatten."
    );

    return;
  }

  const button =
    document.getElementById(
      "authSubmit"
    );

  button.disabled =
    true;

  button.textContent =
    "Even wachten…";

  try {

    if (
      authMode ===
      "login"
    ) {

      const result =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (result.error) {
        throw result.error;
      }

    } else {

      const result =
        await supabaseClient.auth.signUp({
          email,
          password
        });

      if (result.error) {
        throw result.error;
      }

      if (
        !result.data.session
      ) {

        showAuthInfo(
          "Je account is aangemaakt. Controleer je e-mail om je account te bevestigen en log daarna in."
        );

        return;
      }
    }

  } catch (error) {

    console.error(
      error
    );

    showAuthError(
      translateAuthError(
        error
      )
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      authMode === "login"
        ? "Inloggen"
        : "Account maken";
  }
}


function translateAuthError(
  error
) {
  const message =
    String(
      error?.message ||
      error ||
      ""
    );

  const lower =
    message.toLowerCase();

  if (
    lower.includes(
      "invalid login credentials"
    )
  ) {
    return "E-mailadres of wachtwoord is niet correct.";
  }

  if (
    lower.includes(
      "email not confirmed"
    )
  ) {
    return "Je e-mailadres is nog niet bevestigd.";
  }

  if (
    lower.includes(
      "user already registered"
    )
  ) {
    return "Voor dit e-mailadres bestaat al een account.";
  }

  return (
    message ||
    "Er is iets misgegaan."
  );
}

/* =========================================================
   APP START
========================================================= */

async function startForUser(
  user
) {
  /*
    Voorkomt dat getSession() en onAuthStateChange()
    tegelijk twee keer dezelfde volledige laadactie starten.
  */
  if (
    startInProgress &&
    currentUser?.id === user.id
  ) {
    return;
  }

  startInProgress =
    true;

  currentUser =
    user;

  try {

    document
      .getElementById(
        "loadingScreen"
      )
      .classList.remove(
        "hidden"
      );

    document
      .getElementById(
        "authScreen"
      )
      .classList.add(
        "hidden"
      );

    await loadHouseholdData();

    document
      .getElementById(
        "app"
      )
      .classList.remove(
        "hidden"
      );

    document
      .getElementById(
        "loadingScreen"
      )
      .classList.add(
        "hidden"
      );

    document.getElementById(
      "menuUserEmail"
    ).textContent =
      currentUser.email ||
      "";

    document.getElementById(
      "menuUserName"
    ).textContent =
      config.youName ||
      "Gebruiker";

    setupRealtime();

    render();

  } catch (error) {

    console.error(
      "Start app:",
      error
    );

    document
      .getElementById(
        "loadingScreen"
      )
      .classList.add(
        "hidden"
      );

    document
      .getElementById(
        "app"
      )
      .classList.add(
        "hidden"
      );

    document
      .getElementById(
        "authScreen"
      )
      .classList.remove(
        "hidden"
      );

    showAuthError(
      error.message ||
      "Je account is nog niet aan een huishouden gekoppeld."
    );

  } finally {

    startInProgress =
      false;
  }
}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event ===
      "SIGNED_OUT"
    ) {

      currentUser =
        null;

      householdId =
        null;

      startInProgress =
        false;

      if (
        realtimeChannel
      ) {

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;
      }

      document
        .getElementById(
          "app"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "loadingScreen"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "authScreen"
        )
        .classList.remove(
          "hidden"
        );

      return;
    }

    /*
      INITIAL_SESSION wordt al door init() verwerkt.
      We hoeven hier alleen nieuwe sessies te starten.
    */
    if (
      event !== "INITIAL_SESSION" &&
      session?.user
    ) {
      await startForUser(
        session.user
      );
    }
  }
);

/* =========================================================
   INITIAL SESSION
========================================================= */

(async function init() {

  try {

    const result =
      await supabaseClient.auth.getSession();

    if (
      result.error
    ) {
      throw result.error;
    }

    if (
      result.data.session?.user
    ) {

      await startForUser(
        result.data.session.user
      );

    } else {

      document
        .getElementById(
          "loadingScreen"
        )
        .classList.add(
          "hidden"
        );

      document
        .getElementById(
          "authScreen"
        )
        .classList.remove(
          "hidden"
        );
    }

  } catch (error) {

    console.error(
      error
    );

    document
      .getElementById(
        "loadingScreen"
      )
      .classList.add(
        "hidden"
      );

    document
      .getElementById(
        "authScreen"
      )
      .classList.remove(
        "hidden"
      );

    showAuthError(
      "Verbinden met Supabase is mislukt."
    );
  }

})();
