<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6f8">
<title>Huishouden</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #202124;
  --muted: #73777f;
  --border: #e4e6ea;
  --accent: #4f7cff;
  --accent-dark: #3c67dc;
  --green: #2e9b62;
  --red: #dc5757;
  --gray: #b8bcc4;
  --shadow: 0 2px 12px rgba(0,0,0,.06);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================================================
   LOGIN
========================================================= */

#authScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.auth-card {
  width: 100%;
  max-width: 430px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px;
  box-shadow: var(--shadow);
}

.auth-logo {
  text-align: center;
  font-size: 52px;
  margin-bottom: 10px;
}

.auth-card h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 28px;
}

.auth-subtitle {
  text-align: center;
  color: var(--muted);
  margin-bottom: 24px;
}

.auth-mode {
  display: flex;
  gap: 8px;
  background: #f1f2f5;
  padding: 5px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.auth-mode button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 10px;
  border-radius: 9px;
  color: var(--muted);
}

.auth-mode button.active {
  background: white;
  color: var(--text);
  box-shadow: 0 1px 5px rgba(0,0,0,.08);
}

.auth-error {
  background: #fff0f0;
  color: #a33;
  border-radius: 10px;
  padding: 11px 13px;
  margin-bottom: 14px;
  font-size: 14px;
}

.auth-info {
  background: #eef4ff;
  color: #3d5f9d;
  border-radius: 10px;
  padding: 11px 13px;
  margin-bottom: 14px;
  font-size: 14px;
}

.auth-submit {
  width: 100%;
  border: 0;
  background: var(--accent);
  color: white;
  padding: 13px;
  border-radius: 12px;
  font-weight: 700;
  margin-top: 8px;
}

.auth-submit:hover {
  background: var(--accent-dark);
}

/* =========================================================
   APP
========================================================= */

#app {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(245,246,248,.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.topbar-inner {
  max-width: 900px;
  margin: auto;
  min-height: 72px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.topbar-title {
  flex: 1;
  min-width: 0;
}

.topbar-title h1 {
  margin: 0;
  font-size: 21px;
  line-height: 1.2;
}

.topbar-title div {
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
}

.sync-status {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.menu-button {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 12px;
  font-size: 22px;
}

.screen {
  max-width: 900px;
  margin: auto;
  padding: 18px;
}

#mainScreen {
  display: block;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 8px;
}

.tab-button {
  border: 1px solid var(--border);
  background: white;
  border-radius: 13px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  color: var(--muted);
}

.tab-button.active {
  background: var(--text);
  border-color: var(--text);
  color: white;
}

.tab-icon {
  font-size: 18px;
}

.view header h1 {
  margin: 15px 0 3px;
  font-size: 25px;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 14px;
}

.add-button,
.add-frequency-button,
.save-settings-button {
  border: 0;
  background: var(--accent);
  color: white;
  border-radius: 12px;
  padding: 11px 15px;
  font-weight: 700;
}

.add-button {
  width: 100%;
  margin-bottom: 18px;
}

.section {
  margin-bottom: 22px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 18px 2px 9px;
}

.section-title {
  font-weight: 750;
}

.section-count {
  color: var(--muted);
  font-size: 13px;
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 13px 14px;
  box-shadow: var(--shadow);
  transition: transform .1s ease;
}

.task:active {
  transform: scale(.995);
}

.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: 0 0 12px;
}

.status-dot.green {
  background: var(--green);
}

.status-dot.red {
  background: var(--red);
}

.status-dot.gray {
  background: var(--gray);
}

.task-info {
  flex: 1;
  min-width: 0;
}

.task-title {
  font-weight: 700;
  word-break: break-word;
}

.task-meta {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.task-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.task-points {
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.edit-button {
  width: 34px;
  height: 34px;
  border: 0;
  background: #f0f1f4;
  border-radius: 10px;
  font-size: 20px;
}

.empty {
  padding: 20px;
  text-align: center;
  color: var(--muted);
  background: white;
  border: 1px dashed var(--border);
  border-radius: 14px;
}

/* =========================================================
   OTHER SCREENS
========================================================= */

.secondary-screen {
  display: none;
}

.secondary-screen.active {
  display: block;
}

.secondary-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.secondary-header h2 {
  margin: 0;
}

.back-button {
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  padding: 8px 11px;
}

/* =========================================================
   POINTS
========================================================= */

.points-card,
.settings-card,
.history-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 17px;
  box-shadow: var(--shadow);
}

.points-card {
  padding: 22px;
  margin-bottom: 16px;
}

.points-names {
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

.point-person {
  flex: 1;
  text-align: center;
}

.point-person-name {
  color: var(--muted);
  font-size: 14px;
}

.point-number {
  font-size: 42px;
  font-weight: 800;
  margin-top: 4px;
}

.balance {
  display: flex;
  height: 18px;
  border-radius: 20px;
  overflow: hidden;
  background: #eceef2;
  margin: 22px 0 10px;
}

.balance-left,
.balance-right {
  width: 0;
  transition: width .25s ease;
}

.balance-left {
  background: #5d82ed;
}

.balance-right {
  background: #d07a9b;
}

.balance-empty {
  display: none;
}

.balance-description {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

/* =========================================================
   HISTORY
========================================================= */

.history-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.history-item {
  padding: 14px;
}

.history-main {
  display: flex;
  gap: 15px;
  align-items: center;
  justify-content: space-between;
}

.history-task {
  font-weight: 700;
}

.history-details {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.history-points {
  white-space: nowrap;
  font-size: 13px;
  font-weight: 700;
}

.undo-button {
  border: 0;
  background: #f1f2f5;
  border-radius: 9px;
  padding: 8px 10px;
  margin-top: 11px;
  font-size: 12px;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-card {
  padding: 18px;
  margin-bottom: 14px;
}

.settings-card h3 {
  margin: 0 0 5px;
}

.settings-description,
.info-box {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.field {
  margin-top: 14px;
}

.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.field input,
.field select {
  width: 100%;
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  padding: 10px 11px;
  outline: none;
}

.field input:focus,
.field select:focus {
  border-color: var(--accent);
}

.info-box {
  background: #f4f6fa;
  padding: 11px;
  border-radius: 10px;
  margin-top: 14px;
}

.tab-settings-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 750;
  margin-bottom: 5px;
}

.tab-settings-icon {
  font-size: 25px;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-top: 18px;
}

.switch-text {
  flex: 1;
}

.switch-title {
  font-weight: 650;
}

.switch-description {
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}

.switch {
  position: relative;
  width: 48px;
  height: 28px;
  flex: 0 0 48px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background: #d2d5db;
  transition: .2s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}

.switch input:checked + .slider {
  background: var(--accent);
}

.switch input:checked + .slider:before {
  transform: translateX(20px);
}

.icon-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.icon-option {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 9px;
  font-size: 19px;
}

.icon-option.selected {
  border-color: var(--accent);
  background: #edf2ff;
}

.custom-icon-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.custom-icon-row input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px;
}

.icon-preview {
  width: 43px;
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.frequency-row {
  border-top: 1px solid var(--border);
  padding-top: 13px;
  margin-top: 13px;
}

.frequency-grid {
  display: grid;
  grid-template-columns: minmax(0,2fr) 90px 120px 38px;
  gap: 8px;
  align-items: end;
}

.frequency-remove {
  height: 40px;
  border: 0;
  background: #fff0f0;
  color: #a33;
  border-radius: 9px;
  font-size: 22px;
}

.frequency-example {
  color: var(--muted);
  font-size: 11px;
  margin-top: 6px;
}

.add-frequency-button {
  margin-top: 15px;
  background: #eef2ff;
  color: var(--accent-dark);
}

.save-settings-button {
  width: 100%;
  margin: 5px 0 30px;
}

/* =========================================================
   MODALS
========================================================= */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.38);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 500px;
  background: white;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 12px 50px rgba(0,0,0,.2);
}

.modal-content h2 {
  margin: 0;
}

.modal-subtitle {
  color: var(--muted);
  font-size: 13px;
  margin: 6px 0 18px;
}

.completion-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.completion-buttons button {
  border: 0;
  border-radius: 13px;
  padding: 14px;
  background: #eef2ff;
  color: #3459bc;
  font-weight: 700;
}

.completion-buttons .together-button {
  grid-column: 1 / -1;
  background: #edf7f1;
  color: #28784f;
}

.modal-cancel {
  width: 100%;
  border: 1px solid var(--border);
  background: white;
  border-radius: 11px;
  padding: 11px;
  margin-top: 10px;
}

.delete-button {
  width: 100%;
  border: 0;
  background: #fff0f0;
  color: #a33;
  border-radius: 11px;
  padding: 11px;
  margin-top: 10px;
}

.modal-save {
  width: 100%;
  border: 0;
  background: var(--accent);
  color: white;
  border-radius: 11px;
  padding: 12px;
  margin-top: 15px;
  font-weight: 700;
}

/* =========================================================
   MENU
========================================================= */

.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 90;
  display: none;
}

.menu-overlay.show {
  display: block;
}

.menu-panel {
  position: absolute;
  top: 10px;
  right: 10px;
  width: min(320px, calc(100% - 20px));
  background: white;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
  padding: 10px;
}

.menu-panel button {
  width: 100%;
  text-align: left;
  border: 0;
  background: white;
  border-radius: 11px;
  padding: 13px;
}

.menu-panel button:hover {
  background: #f3f4f7;
}

.menu-user {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 5px;
}

.menu-user-name {
  font-weight: 700;
}

.menu-user-email {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}

/* =========================================================
   TOAST / LOADING
========================================================= */

.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
}

.loading-spinner {
  width: 35px;
  height: 35px;
  border: 3px solid #dfe2e7;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  z-index: 300;
  background: #22252a;
  color: white;
  border-radius: 12px;
  padding: 11px 15px;
  font-size: 13px;
  box-shadow: 0 6px 25px rgba(0,0,0,.2);
  display: none;
}

.toast.show {
  display: block;
}

@media (max-width: 650px) {
  .frequency-grid {
    grid-template-columns: 1fr 80px;
  }

  .frequency-grid .unit-field {
    grid-column: 1 / 2;
  }

  .frequency-grid .frequency-remove {
    grid-column: 2 / 3;
  }

  .sync-status {
    display: none;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     LOGIN
======================================================== -->

<div id="authScreen" class="hidden">
  <div class="auth-card">
    <div class="auth-logo">🏠</div>
    <h1>Huishouden</h1>
    <div class="auth-subtitle">
      Log in om jullie huishouden samen te beheren.
    </div>

    <div class="auth-mode">
      <button id="loginModeButton" class="active" type="button">
        Inloggen
      </button>
      <button id="signupModeButton" type="button">
        Account maken
      </button>
    </div>

    <div id="authError" class="auth-error hidden"></div>
    <div id="authInfo" class="auth-info hidden"></div>

    <div class="field">
      <label for="authEmail">E-mailadres</label>
      <input id="authEmail" type="email" autocomplete="email">
    </div>

    <div class="field">
      <label for="authPassword">Wachtwoord</label>
      <input id="authPassword" type="password" autocomplete="current-password">
    </div>

    <button id="authSubmit" class="auth-submit" type="button">
      Inloggen
    </button>
  </div>
</div>


<!-- =======================================================
     LOADING
======================================================== -->

<div id="loadingScreen" class="loading-screen">
  <div class="loading-spinner"></div>
  <div>Huishouden laden…</div>
</div>


<!-- =======================================================
     APP
======================================================== -->

<div id="app" class="hidden">

  <div class="topbar">
    <div class="topbar-inner">

      <div class="topbar-title">
        <h1 id="appTitle">Huishouden</h1>
        <div id="appSubtitle">Taken overzicht</div>
      </div>

      <div id="syncStatus" class="sync-status">
        Verbinden…
      </div>

      <button
        class="menu-button"
        type="button"
        onclick="openMenu()"
        aria-label="Menu"
      >
        ☰
      </button>

    </div>
  </div>


  <!-- MAIN -->

  <main id="mainScreen" class="screen">

    <div id="tabs" class="tabs"></div>

    <div id="tabViews"></div>

  </main>


  <!-- POINTS -->

  <section id="pointsScreen" class="screen secondary-screen">

    <div class="secondary-header">
      <button class="back-button" onclick="showMainScreen()">←</button>
      <h2>Punten</h2>
    </div>

    <div class="points-card">

      <div class="points-names">

        <div class="point-person">
          <div id="youNameLabel" class="point-person-name">Jij</div>
          <div id="youPoints" class="point-number">0</div>
        </div>

        <div class="point-person">
          <div id="partnerNameLabel" class="point-person-name">Partner</div>
          <div id="partnerPoints" class="point-number">0</div>
        </div>

      </div>

      <div class="balance">
        <div id="balanceLeft" class="balance-left"></div>
        <div id="balanceRight" class="balance-right"></div>
      </div>

      <div id="balanceEmpty" class="balance-empty">
        Nog geen punten
      </div>

      <div id="balanceDescription" class="balance-description">
        Nog geen punten
      </div>

    </div>

  </section>


  <!-- HISTORY -->

  <section id="historyScreen" class="screen secondary-screen">

    <div class="secondary-header">
      <button class="back-button" onclick="showMainScreen()">←</button>
      <h2>Geschiedenis</h2>
    </div>

    <div id="historyList" class="history-list"></div>

  </section>


  <!-- SETTINGS -->

  <section id="settingsScreen" class="screen secondary-screen">

    <div class="secondary-header">
      <button class="back-button" onclick="showMainScreen()">←</button>
      <h2>Instellingen</h2>
    </div>

    <div id="settingsContent"></div>

  </section>


  <!-- MENU -->

  <div
    id="menuOverlay"
    class="menu-overlay"
    onclick="handleMenuBackground(event)"
  >

    <div class="menu-panel">

      <div class="menu-user">
        <div id="menuUserName" class="menu-user-name"></div>
        <div id="menuUserEmail" class="menu-user-email"></div>
      </div>

      <button onclick="openPoints()">🏆 Punten</button>
      <button onclick="openHistory()">📜 Geschiedenis</button>
      <button onclick="openSettings()">⚙️ Instellingen</button>
      <button onclick="signOut()">🚪 Uitloggen</button>

    </div>

  </div>


  <!-- COMPLETION MODAL -->

  <div id="completionModal" class="modal">

    <div class="modal-content">

      <h2 id="completionTitle">Taak</h2>

      <div id="completionSubtitle" class="modal-subtitle">
        Wie heeft dit gedaan?
      </div>

      <div class="completion-buttons">

        <button id="youButton" onclick="completeTask('you')">
          Jij
        </button>

        <button id="partnerButton" onclick="completeTask('partner')">
          Partner
        </button>

        <button
          class="together-button"
          onclick="completeTask('together')"
        >
          Samen
        </button>

      </div>

      <button
        class="modal-cancel"
        onclick="closeCompletionModal()"
      >
        Annuleren
      </button>

    </div>

  </div>


  <!-- TASK EDITOR -->

  <div id="taskEditorModal" class="modal">

    <div class="modal-content">

      <h2 id="editorTitle">Taak toevoegen</h2>

    character => {

        Math.random() * 16 | 0;

      const value =
        character === "x"
          ? random
          : (random & 0x3 | 0x8);

      return value.toString(16);

  );

/* =========================================================

function normalizeFrequency(frequency) {

  const unit =
    ["days","weeks","months"].includes(
      frequency?.unit

      ? frequency.unit

  const interval =
    Math.max(
      1,
      Math.min(
        999,
        Math.floor(
          Number(
            frequency?.interval
          ) || 1
        )
      )
    );

  return {
    id:
      frequency?.id ||
      createId(),

    name:
      frequency?.name ||
      makeFrequencyName(
        unit,
        interval
      ),

    unit,
    interval
  };

}


function normalizeTask(task) {

  return {
    id:
      task?.id ||

    title:

    frequencyId:

      null,

    points:
      Math.max(

        Number(

      )

}

/* =========================================================
   DATE HELPERS
========================================================= */

function dateOnly(date) {

  const result =
    new Date(date);

  result.setHours(
    0,
    0,
    0,
    0
  );

  return result;

}


function getStartDate() {

  if (
    config.startDate
  ) {

    const date =
      new Date(
        config.startDate +
        "T00:00:00"
      );

    if (
      !Number.isNaN(
        date.getTime()
      )
    ) {

      return dateOnly(
        date
      );

    }

  }

  return dateOnly(
    new Date()
  );

}


function addDays(
  date,
  days
) {

  const result =
    new Date(date);

  result.setDate(
    result.getDate() +
    days
  );

  return result;

}


function addMonths(
  date,
  months
) {

  const result =
    new Date(date);

  result.setMonth(
    result.getMonth() +
    months
  );

  return result;

}


function isBeforeStartDate(
  date
) {

  return dateOnly(
    date
  ) <
  getStartDate();

}


/* =========================================================
   FREQUENCIES
========================================================= */

function getFrequency(
  tab,
  task
) {

  if (
    !tab ||
    !task ||
    !task.frequencyId
  ) {

    return null;

  }

  return (
    tab.frequencies.find(
      frequency =>
        frequency.id ===
        task.frequencyId
    ) ||
    null
  );

}


function makeFrequencyName(
  unit,
  interval
) {

  const amount =
    Number(interval) || 1;

  if (
    unit === "days"
  ) {

    return `Elke ${amount} ${
      amount === 1
        ? "dag"
        : "dagen"
    }`;

  }

  if (
    unit === "months"
  ) {

    return `Elke ${amount} ${
      amount === 1
        ? "maand"
        : "maanden"
    }`;

  }

  return `Elke ${amount} ${
    amount === 1
      ? "week"
      : "weken"
  }`;

}


function getFrequencyLabel(
  frequency
) {

  if (!frequency) {
    return "Geen frequentie";
  }

  return (
    frequency.name ||
    makeFrequencyName(
      frequency.unit,
      frequency.interval
    )
  );

}


/* =========================================================
   PERIOD
========================================================= */

function getPeriodInfo(
  tab,
  task,
  date = new Date()
) {

  const frequency =
    getFrequency(
      tab,
      task
    );

  if (!frequency) {
    return null;
  }

  const current =
    dateOnly(date);

  const startAnchor =
    getStartDate();

  if (
    current <
    startAnchor
  ) {

    return null;

  }


  if (
    frequency.unit ===
    "days"
  ) {

    const diff =
      Math.floor(
        (
          current -
          startAnchor
        ) /
        86400000
      );

    const block =
      Math.floor(
        diff /
        frequency.interval
      );

    const start =
      addDays(
        startAnchor,
        block *
        frequency.interval
      );

    const end =
      addDays(
        start,
        frequency.interval - 1
      );

    end.setHours(
      23,
      59,
      59,
      999
    );

    return {
      start,
      end,
      key:
        start
          .toISOString()
          .slice(0, 10)
    };

  }


  if (
    frequency.unit ===
    "weeks"
  ) {

    const intervalDays =
      frequency.interval *
      7;

    const diff =
      Math.floor(
        (
          current -
          startAnchor
        ) /
        86400000
      );

    const block =
      Math.floor(
        diff /
        intervalDays
      );

    const start =
      addDays(
        startAnchor,
        block *
        intervalDays
      );

    const end =
      addDays(
        start,
        intervalDays - 1
      );

    end.setHours(
      23,
      59,
      59,
      999
    );

    return {
      start,
      end,
      key:
        start
          .toISOString()
          .slice(0, 10)
    };

  }


  if (
    frequency.unit ===
    "months"
  ) {

    let cursor =
      new Date(
        startAnchor
      );

    let block = 0;

    while (
      addMonths(
        cursor,
        frequency.interval
      ) <= current
    ) {

      cursor =
        addMonths(
          cursor,
          frequency.interval
        );

      block++;

      if (
        block > 10000
      ) {
        break;
      }

    }

    const start =
      cursor;

    const next =
      addMonths(
        start,
        frequency.interval
      );

    const end =
      addDays(
        next,
        -1
      );

    end.setHours(
      23,
      59,
      59,
      999
    );

    return {
      start,
      end,
      key:
        start
          .toISOString()
          .slice(0, 10)
    };

  }

  return null;

}


function getPeriodKey(
  tab,
  task,
  date = new Date()
) {

  const info =
    getPeriodInfo(
      tab,
      task,
      date
    );

  return info
    ? info.key
    : null;

}


/* =========================================================
   COMPLETIONS
========================================================= */

function getTaskCompletions(
  task
) {

  return completions.filter(
    completion =>
      completion.taskId ===
      task.id
  );

}


function getCurrentCompletion(
  tab,
  task
) {

  const period =
    getPeriodKey(
      tab,
      task
    );

  if (!period) {
    return null;
  }

  return (
    completions.find(
      completion =>
        completion.taskId ===
          task.id &&
        completion.tabId ===
          tab.id &&
        completion.period ===
          period
    ) ||
    null
  );

}


function getLastCompletion(
  tab,
  task
) {

  const list =
    getTaskCompletions(
      task
    )
      .filter(
        completion =>
          completion.tabId ===
          tab.id
      );

  if (!list.length) {
    return null;
  }

  return list
    .slice()
    .sort(
      (a, b) =>
        new Date(
          b.completedAt
        ) -
        new Date(
          a.completedAt
        )
    )[0];

}


/* =========================================================
   STATUS
========================================================= */

function isOverdue(
  tab,
  task
) {

  if (
    !tab.frequencyEnabled
  ) {
    return false;
  }

  const frequency =
    getFrequency(
      tab,
      task
    );

  if (!frequency) {
    return false;
  }

  const now =
    new Date();

  if (
    isBeforeStartDate(
      now
    )
  ) {
    return false;
  }

  const current =
    getPeriodInfo(
      tab,
      task,
      now
    );

  if (!current) {
    return false;
  }

  if (
    getCurrentCompletion(
      tab,
      task
    )
  ) {
    return false;
  }

  /*
    De huidige periode is nog bezig.
    Dus niet rood.
  */

  if (
    now <=
    current.end
  ) {
    return false;
  }

  return true;

}


function getTaskStatus(
  tab,
  task
) {

  if (
    getCurrentCompletion(
      tab,
      task
    )
  ) {
    return "green";
  }

  if (
    isOverdue(
      tab,
      task
    )
  ) {
    return "red";
  }

  return "gray";

}

function getPointsTotals() {

  let you = 0;
  let partner = 0;

  completions.forEach(

      const points =

          completion.points ||
          0
        );

      if (

        "you"
      ) {

      if (

/* =========================================================
   DATABASE → APP
========================================================= */

function rebuildConfigFromRows(
  households,
  settings,
  tabs,
  frequencies,
  tasks
) {

  const current =
    config || createDefaultConfig();

  const household =
    households?.[0];

  const setting =
    settings?.[0];

  const tabRows =
    (tabs || [])
      .slice()
      .sort(
        (a, b) =>
          Number(a.position || 0) -
          Number(b.position || 0)
      );

  const frequencyRows =
    frequencies || [];

  const taskRows =
    tasks || [];

  const result = {

    appName:
      household?.name ||
      current.appName ||
      "Huishouden",

    /*
      Er is in household_settings geen
      subtitle-kolom. Daarom blijft deze
      waarde lokaal per browser.
    */
    appSubtitle:
      current.appSubtitle ||
      "Taken overzicht",

    youName:
      setting?.you_name ||
      current.youName ||
      "Jij",

    partnerName:
      setting?.partner_name ||
      current.partnerName ||
      "Partner",

    startDate:
      setting?.start_date ||
      current.startDate ||
      "",

    tabs:
      tabRows.map(
        tabRow => {

          const tabFrequencies =
            frequencyRows
              .filter(
                frequency =>
                  frequency.position !== undefined &&
                  frequency.position !== null
              )
              .filter(
                frequency =>
                  frequency._tabId ===
                  tabRow.id
              );

          /*
            Frequencies hebben geen tab_id in
            het schema. Ze zijn gekoppeld aan
            household_id. Om de bestaande app-
            structuur te behouden, gebruiken we
            de tab-indeling zoals die uit lokale
            data wordt overgenomen als die
            beschikbaar is. Nieuwe frequenties
            worden aan de actieve tab gekoppeld
            via een lokale mapping.

            Voor bestaande data zoeken we daarom
            eerst op frequency-id.
          */

          const oldTab =
            current.tabs.find(
              t =>
                t.id ===
                tabRow.id
            );

          const oldFrequencies =
            oldTab?.frequencies ||
            [];

          const frequenciesForTab =
            oldFrequencies
              .map(
                oldFrequency => {

                  const dbFrequency =
                    frequencyRows.find(
                      frequency =>
                        frequency.id ===
                        oldFrequency.id
                    );

                  if (
                    !dbFrequency
                  ) {
                    return oldFrequency;
                  }

                  return {
                    id:
                      dbFrequency.id,

                    name:
                      dbFrequency.name,

                    unit:
                      dbFrequency.unit,

                    interval:
                      dbFrequency.amount
                  };

                }
              );

          const tabTasks =
            taskRows
              .filter(
                task =>
                  task.tab_id ===
                  tabRow.id
              )
              .map(
                task => ({
                  id:
                    task.id,

                  title:
                    task.title,

                  frequencyId:
                    task.frequency_id,

                  points:
                    Number(
                      task.points || 0
                    )
                })
              );

          return {

            id:
              tabRow.id,

            name:
              tabRow.name,

            icon:
              tabRow.icon ||
              "📌",

            pointsEnabled:
              tabRow.use_points !== false,

            frequencyEnabled:
              tabRow.use_frequency === true,

            frequencies:
              frequenciesForTab,

            tasks:
              tabTasks

          };

        }
      )

  };

  return normalizeConfig(
    result
  );

}


/* =========================================================
   FIND HOUSEHOLD
========================================================= */

async function findHouseholdForCurrentUser() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("household_user_access")
      .select(
        "household_id"
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if (error) {
    throw error;
  }

  if (
    data &&
    data.length
  ) {

    return data[0].household_id;

  }


  /*
    Tweede poging via household_members.
    Dit werkt wanneer het account rechtstreeks
    als lid is opgenomen.
  */

  const membership =
    await supabaseClient
      .from("household_members")
      .select(
        "household_id"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .limit(1);

  if (
    !membership.error &&
    membership.data &&
    membership.data.length
  ) {

    return membership.data[0].household_id;

  }

  return null;

}

        .eq(
          "household_id",
          householdId
        )
        .order(
          "position",
          {
            ascending: true
          }
        ),

      supabaseClient
        .from("frequencies")
        .select("*")
        .eq(
          "household_id",
          householdId
        )
        .order(
          "position",
          {
            ascending: true
          }
        ),

      supabaseClient
        .from("tasks")
        .select("*")
        .eq(
          "household_id",
          householdId
        ),

      supabaseClient
        .from("completions")
        .select("*")
        .eq(
          "household_id",
          householdId
        )
        .order(
          "completed_at",
          {
            ascending: false
          }
        )

    ]);


  const results = [
    householdResult,
    settingsResult,
    tabsResult,
    frequenciesResult,
    tasksResult,
    completionsResult
  ];

  const failed =
    results.find(
      result =>
        result.error
    );

  if (failed) {
    throw failed.error;
  }


  /*
    Frequenties in jouw bestaande schema hebben
    geen tab_id. Daarom bewaren we de relatie
    frequency → tab via de taak: een frequency
    wordt bij het laden gekoppeld aan de tab van
    de taken die hem gebruiken.

    Voor lege frequenties nemen we de lokale
    mapping mee wanneer die beschikbaar is.
  */

  const oldConfig =
    loadLocalConfig();

  const oldTabs =
    oldConfig?.tabs ||
    [];

  const frequencies =
    frequenciesResult.data || [];

  const enrichedFrequencies =
    frequencies.map(
      frequency => {

        let tabId = null;

        for (
          const oldTab of oldTabs
        ) {

          if (
            oldTab.frequencies.some(
              f =>
                f.id ===
                frequency.id
            )
          ) {

            tabId =
              oldTab.id;

            break;

          }

        }

        return {
          ...frequency,
          _tabId:
            tabId
        };

      }
    );


  config =
    rebuildConfigFromRows(
      householdResult.data,
      settingsResult.data,
      tabsResult.data,
      enrichedFrequencies,
      tasksResult.data
    );


  /*
    Als Supabase nog helemaal leeg is maar er
    lokale gegevens bestaan, proberen we éénmalig
    de lokale app naar het huishouden te migreren.
  */

  const hasDatabaseContent =
    (
      (tabsResult.data || []).length > 0 ||
      (tasksResult.data || []).length > 0 ||
      (frequenciesResult.data || []).length > 0 ||
      (completionsResult.data || []).length > 0
    );

  if (
    !hasDatabaseContent &&
    oldConfig &&
    oldConfig.tabs.length
  ) {

    await migrateLocalData(
      oldConfig,
      loadLocalCompletions()
    );

    /*
      Na migratie opnieuw laden.
    */

    return await loadHouseholdData();

  }


  completions =
    (completionsResult.data || [])
      .map(
        mapCompletionFromDb
      );

  /*
    App subtitle bestaat niet als kolom in de
    huidige database.
  */
  try {

    const localSubtitle =
      localStorage.getItem(
        STORAGE_KEYS.subtitle
      );

    if (localSubtitle) {
      config.appSubtitle =
        localSubtitle;
    }

  } catch (_) {}


  currentTabId =
    config.tabs[0]?.id ||
    null;

  saveLocalCache();

  loadingData = false;

  setSyncStatus(
    "Gesynchroniseerd"
  );

}


/* =========================================================
   DB → COMPLETION
========================================================= */

function mapCompletionFromDb(
  row
) {

  return {

    id:
      row.id,

    tabId:
      findTabIdForTask(
        row.task_id
      ),

    taskId:
      row.task_id,

    taskTitle:
      row.task_title,

    person:
      row.person_type,

    points:
      Number(
        row.points || 0
      ),

    period:
      row.period_key,

    completedAt:
      row.completed_at

  };

}


function findTabIdForTask(
  taskId
) {

  for (
    const tab of config.tabs
  ) {

    if (
      tab.tasks.some(
        task =>
          task.id ===
          taskId
      )
    ) {

      return tab.id;

    }

  }

  return null;

}


/* =========================================================
   LOCAL → SUPABASE MIGRATION
========================================================= */

async function migrateLocalData(
  localConfig,
  localCompletions
) {

  if (!householdId) {
    return;
  }

  setSyncStatus(
    "Lokale gegevens importeren…"
  );

  const idMap =
    new Map();


  /*
    Tabs
  */

  for (
    let index = 0;
    index < localConfig.tabs.length;
    index++
  ) {

    const localTab =
      localConfig.tabs[index];

    const newId =
      isUuid(localTab.id)
        ? localTab.id
        : createId();

    idMap.set(
      `tab:${localTab.id}`,
      newId
    );

    const result =
      await supabaseClient
        .from("tabs")
        .upsert({
          id: newId,
          household_id: householdId,
          name:
            localTab.name,
          icon:
            localTab.icon,
          position:
            index,
          enabled:
            true,
          use_points:
            !!localTab.pointsEnabled,
          use_frequency:
            !!localTab.frequencyEnabled
        });

    if (result.error) {
      throw result.error;
    }

  }


  /*
    Frequencies
  */

  for (
    const localTab of localConfig.tabs
  ) {

    for (
      let index = 0;
      index < localTab.frequencies.length;
      index++
    ) {

      const localFrequency =
        localTab.frequencies[index];

      const newId =
        isUuid(localFrequency.id)
          ? localFrequency.id
          : createId();

      idMap.set(
        `frequency:${localFrequency.id}`,
        newId
      );

      const result =
        await supabaseClient
          .from("frequencies")
          .upsert({
            id: newId,
            household_id:
              householdId,
            name:
              localFrequency.name,
            amount:
              localFrequency.interval,
            unit:
              localFrequency.unit,
            position:
              index,
            enabled:
              true
          });

      if (result.error) {
        throw result.error;
      }

    }

  }


  /*
    Tasks
  */

  for (
    const localTab of localConfig.tabs
  ) {

    for (
      const localTask of localTab.tasks
    ) {

      const newId =
        isUuid(localTask.id)
          ? localTask.id
          : createId();

      idMap.set(
        `task:${localTask.id}`,
        newId
      );

      const result =
        await supabaseClient
          .from("tasks")
          .upsert({
            id:
              newId,
            household_id:
              householdId,
            tab_id:
              idMap.get(
                `tab:${localTab.id}`
              ),
            title:
              localTask.title,
            frequency_id:
              localTask.frequencyId
                ? idMap.get(
                    `frequency:${localTask.frequencyId}`
                  )
                : null,
            points:
              Number(
                localTask.points || 0
              ),
            enabled:
              true
          });

      if (result.error) {
        throw result.error;
      }

    }

  }


  /*
    Settings
  */

  const settingsResult =
    await supabaseClient
      .from("household_settings")
      .upsert({
        household_id:
          householdId,
        start_date:
          localConfig.startDate ||
          null,
        you_name:
          localConfig.youName ||
          "Jij",
        partner_name:
          localConfig.partnerName ||
          "Partner"
      });

  if (settingsResult.error) {
    throw settingsResult.error;
  }


  /*
    Household name
  */

  const householdResult =
    await supabaseClient
      .from("households")
      .update({
        name:
          localConfig.appName ||
          "Huishouden"
      })
      .eq(
        "id",
        householdId
      );

  if (householdResult.error) {
    throw householdResult.error;
  }


  /*
    Completions
  */

  for (
    const completion of localCompletions
  ) {

    const taskId =
      idMap.get(
        `task:${completion.taskId}`
      );

    if (!taskId) {
      continue;
    }

    const result =
      await supabaseClient
        .from("completions")
        .upsert({
          id:
            isUuid(completion.id)
              ? completion.id
              : createId(),
          household_id:
            householdId,
          task_id:
            taskId,
          task_title:
            completion.taskTitle ||
            "",
          user_id:
            currentUser.id,
          person_name:
            personLabel(
              completion.person
            ),
          person_type:
            completion.person,
          points:
            Number(
              completion.points || 0
            ),
          period_key:
            completion.period ||
            null,
          completed_at:
            completion.completedAt ||
            new Date().toISOString()
        });

    if (result.error) {
      throw result.error;
    }

  }

}


/* =========================================================
   UUID
========================================================= */

function isUuid(value) {

  return (
    typeof value === "string" &&
    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
      value
    )
  );

}

/* =========================================================

========================================================= */

function render() {

  renderHeader();
  renderTabs();
  renderTabViews();
  renderPoints();

  renderSettings();

}


/* =========================================================
   HEADER
========================================================= */

function renderHeader() {

  document.getElementById(
    "appTitle"
  ).textContent =
    config.appName ||
    "Huishouden";

  document.getElementById(
    "appSubtitle"
  ).textContent =
    config.appSubtitle ||
    "Taken overzicht";

}


/* =========================================================
   TABS
========================================================= */

function renderTabs() {

  const container =
    document.getElementById(
      "tabs"
    );

  container.innerHTML =
    "";

  config.tabs.forEach(
    tab => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "tab-button";

      if (
        tab.id ===
        currentTabId
      ) {

        button.classList.add(
          "active"
        );

      }

      const icon =
        document.createElement(
          "span"
        );

      icon.className =
        "tab-icon";

      icon.textContent =
        tab.icon;

      const label =
        document.createElement(
          "span"
        );

      label.className =
        "tab-label";

      label.textContent =
        tab.name;

      button.appendChild(
        icon
      );

      button.appendChild(
        label
      );

      button.onclick =
        () => {

          currentTabId =
            tab.id;

          render();

        };

      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   TAB VIEWS
========================================================= */

function renderTabViews() {

  const container =
    document.getElementById(
      "tabViews"
    );

  container.innerHTML =
    "";

  const tab =
    config.tabs.find(
      t =>
        t.id ===

    ) ||

  if (!tab) {
    return;
  }

  currentTabId =
    tab.id;

  const view =
    document.createElement(
      "div"
    );

  view.className =
    "view active";

  const header =
    document.createElement(
      "header"
    );

  const title =
    document.createElement(
      "h1"
    );

  title.textContent =
    `${tab.icon} ${tab.name}`;

  const subtitle =
    document.createElement(
      "div"
    );

  subtitle.className =
    "subtitle";

  subtitle.textContent =
    tab.frequencyEnabled
      ? "Taken met een ingesteld ritme"
      : "Taken zonder vast tijdschema";

  header.appendChild(
    title
  );

  header.appendChild(
    subtitle
  );

  const addButton =
    document.createElement(
      "button"
    );

  addButton.className =
    "add-button";

  addButton.textContent =

  addButton.onclick =

      );

      view
    );

  }

  container.appendChild(
    view
  );

}


/* =========================================================
   RECURRING TAB
========================================================= */

function renderRecurringTab(
  tab,
  container
) {

  if (
    !tab.frequencies.length
  ) {

    container.innerHTML +=
      `
      <div class="empty">
        Er zijn nog geen frequenties ingesteld.
        Voeg eerst een frequentie toe via Instellingen.
      </div>
      `;

    return;

  }

  tab.frequencies.forEach(
    frequency => {

      const section =
        document.createElement(
          "div"
        );

      section.className =
        "section";

      const sectionTasks =
        tab.tasks.filter(
          task =>
            task.frequencyId ===
            frequency.id
        );

      const header =
        document.createElement(
          "div"
        );

      header.className =
        "section-header";

      const title =
        document.createElement(
          "div"
        );

      title.className =
        "section-title";

      title.textContent =
        getFrequencyLabel(
          frequency
        );

      const count =
        document.createElement(
          "div"
        );

      count.className =
        "section-count";

      const completed =
        sectionTasks.filter(
          task =>
            !!getCurrentCompletion(
              tab,
              task
            )
        ).length;

      count.textContent =
        `${completed}/${sectionTasks.length} gedaan`;

      header.appendChild(
        title
      );

      header.appendChild(
        count
      );

      const list =
        document.createElement(
          "div"
        );

      list.className =
        "task-list";

      const sorted =
        sectionTasks
          .slice()
          .sort(
            (a, b) =>
              getStatusSortValue(
                tab,
                a
              ) -
              getStatusSortValue(
                tab,
                b
              )
          );

      if (!sorted.length) {

        list.innerHTML =
          `
          <div class="empty">
            Nog geen taken in deze frequentie.
          </div>
          `;

      } else {

        sorted.forEach(
          task => {

            list.appendChild(
              createTaskElement(
                tab,
                task
              )
            );

          }
        );

      }

      section.appendChild(
        header
      );

      section.appendChild(
        list
      );

      container.appendChild(
        section
      );

    }
  );

}


/* =========================================================
   NORMAL TAB
========================================================= */

function renderNormalTab(
  tab,
  container
) {

  const list =
    document.createElement(
      "div"
    );

  list.className =
    "task-list";

  if (
    !tab.tasks.length
  ) {

    list.innerHTML =
      `
      <div class="empty">
        Nog geen taken toegevoegd.
      </div>
      `;

  } else {

    tab.tasks.forEach(
      task => {

        list.appendChild(
          createTaskElement(
            tab,
            task
          )
        );

      }
    );

  }

  container.appendChild(
    list
  );

}


/* =========================================================
   TASK ELEMENT
========================================================= */

function createTaskElement(
  tab,
  task
) {

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "task";

  const dot =
    document.createElement(
      "div"
    );

  dot.className =
    "status-dot " +
    getTaskStatus(
      tab,
      task
    );

  const info =
    document.createElement(
      "div"
    );

  info.className =
    "task-info";

  const title =
    document.createElement(
      "div"
    );

  title.className =
    "task-title";

  title.textContent =
    task.title;

  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "task-meta";

  const completion =
    getCurrentCompletion(
      tab,
      task
    );

  if (completion) {

    meta.textContent =
      `Gedaan door ${personLabel(
        completion.person
      )} · deze periode`;

  } else if (
    tab.frequencyEnabled &&
    isOverdue(
      tab,
      task
    )
  ) {

    const period =
      getPeriodInfo(
        tab,
        task
      );

    meta.textContent =
      period
        ? `Achterstallig sinds ${formatDate(
            period.start
          )}`
        : "Achterstallig";

  } else if (
    tab.frequencyEnabled
  ) {

    const frequency =
      getFrequency(
        tab,
        task
      );

    meta.textContent =
      frequency
        ? getFrequencyLabel(
            frequency
          )
        : "Geen frequentie";

  } else {

    const last =
      getLastCompletion(
        tab,
        task
      );

    meta.textContent =
      last
        ? `Laatst gedaan: ${formatDate(
            last.completedAt
          )}`
        : "Nog niet uitgevoerd";

  }

  info.appendChild(
    title
  );

  info.appendChild(
    meta
  );

  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "task-actions";

  if (
    tab.pointsEnabled
  ) {

    const points =
      document.createElement(
        "div"
      );

    points.className =
      "task-points";

    points.textContent =
      `${task.points} pt`;

    actions.appendChild(
      points
    );

  }

  const edit =
    document.createElement(
      "button"
    );

  edit.className =
    "edit-button";

  edit.textContent =
    "⋯";

  edit.title =
    "Bewerken";

  edit.onclick =
    event => {

      event.stopPropagation();

      openTaskEditor(
        tab.id,
        task.id
      );

    };

  actions.appendChild(
    edit
  );

  element.appendChild(
    dot
  );

  element.appendChild(
    info
  );

  element.appendChild(
    actions
  );

  element.onclick =
    event => {

      if (
        event.target.closest(
          ".edit-button"
        )
      ) {
        return;
      }

      openCompletionModal(
        tab,
        task
      );

    };

  return element;

}


/* =========================================================
   SORT
========================================================= */

function getStatusSortValue(
  tab,
  task
) {

  const status =
    getTaskStatus(
      tab,
      task
    );

  if (
    status === "red"
  ) {
    return 0;
  }

  if (
    status === "gray"
  ) {
    return 1;
  }

  return 2;

}


/* =========================================================
   COMPLETION MODAL
========================================================= */

function openCompletionModal(
  tab,
  task
) {

  selectedTask = {
    tabId: tab.id,
    taskId: task.id
  };

  document.getElementById(
    "completionTitle"
  ).textContent =
    task.title;

  const pointsText =
    tab.pointsEnabled
      ? `${task.points} ${
          task.points === 1
            ? "punt"
            : "punten"
        } · `
      : "";

  document.getElementById(
    "completionSubtitle"
  ).textContent =
    `${pointsText}Wie heeft dit gedaan?`;

  document.getElementById(
    "youButton"
  ).textContent =
    config.youName ||
    "Jij";

  document.getElementById(
    "partnerButton"
  ).textContent =
    config.partnerName ||
    "Partner";

  document
    .getElementById(
      "completionModal"
    )
    .classList.add(
      "show"
    );

}


function closeCompletionModal() {

  selectedTask =
    null;

  document
    .getElementById(
      "completionModal"
    )
    .classList.remove(
      "show"
    );

}


/* =========================================================
   COMPLETE TASK
========================================================= */

async function completeTask(
  person
) {

  if (!selectedTask) {
    return;
  }

  const tab =
    config.tabs.find(
      t =>
        t.id ===
        selectedTask.tabId
    );

  if (!tab) {
    return;
  }

  const task =
    tab.tasks.find(
      t =>
        t.id ===
        selectedTask.taskId
    );

  if (!task) {
    closeCompletionModal();
    return;
  }

  if (
    tab.frequencyEnabled
  ) {

    const existing =
      getCurrentCompletion(
        tab,
        task
      );

    if (existing) {

      closeCompletionModal();

      showToast(
        "Deze taak is al gedaan voor deze periode."
      );

      return;

    }

  }

  const points =
    tab.pointsEnabled
      ? Number(
          task.points || 0
        )
      : 0;

  const completion = {

    id:
      createId(),

    tabId:
      tab.id,

    taskId:
      task.id,

    taskTitle:
      task.title,

    person,

    points,

    period:
      tab.frequencyEnabled
        ? getPeriodKey(
            tab,
            task
          )
        : null,

    completedAt:
      new Date().toISOString()

  };

  try {

    setSyncStatus(
      "Opslaan…"
    );

    await saveCompletionToDb(
      completion
    );

    completions.unshift(
      completion
    );

    saveLocalCache();

    closeCompletionModal();

    render();

    setSyncStatus(
      "Gesynchroniseerd"
    );

  } catch (error) {

    console.error(
      error
    );

    setSyncStatus(
      "Synchronisatiefout"
    );

    showToast(
      "Opslaan mislukt."
    );

  }

}


/* =========================================================

========================================================= */

function openTaskEditor(
  tabId,
  taskId = null
) {

  const tab =
    config.tabs.find(
      t =>
        t.id ===
        tabId
    );

  if (!tab) {
    return;
  }

  editorTabId =
    tabId;

  editingTaskId =
    taskId;

  const titleInput =
    document.getElementById(
      "taskTitleInput"
    );

  const frequencyInput =
    document.getElementById(
      "taskFrequencyInput"
    );

  const pointsInput =
    document.getElementById(
      "taskPointsInput"
    );

  const frequencyField =
    document.getElementById(
      "taskFrequencyField"
    );

  const pointsField =
    document.getElementById(
      "taskPointsField"
    );

  const deleteButton =
    document.getElementById(
      "deleteTaskButton"
    );

  titleInput.value =
    "";

  pointsInput.value =
    "1";

  frequencyInput.innerHTML =
    "";

  tab.frequencies.forEach(
    frequency => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        frequency.id;

      option.textContent =
        getFrequencyLabel(
          frequency
        );

      frequencyInput.appendChild(
        option
      );

    }
  );

  if (taskId) {

    const task =
      tab.tasks.find(
        t =>
          t.id ===
          taskId
      );

    if (!task) {
      return;
    }

    titleInput.value =
      task.title;

    pointsInput.value =
      task.points;

    if (
      task.frequencyId &&
      tab.frequencies.some(
        f =>
          f.id ===
          task.frequencyId
      )
    ) {

      frequencyInput.value =
        task.frequencyId;

    }

    document.getElementById(
      "editorTitle"
    ).textContent =
      "Taak bewerken";

    deleteButton.style.display =
      "block";

  } else {

    document.getElementById(
      "editorTitle"
    ).textContent =
      "Taak toevoegen";

    deleteButton.style.display =
      "none";

    if (
      tab.frequencies[0]
    ) {

      frequencyInput.value =
        tab.frequencies[0].id;

    }

  }

  frequencyField.style.display =
    tab.frequencyEnabled &&
    tab.frequencies.length
      ? "block"
      : "none";

  pointsField.style.display =
    tab.pointsEnabled
      ? "block"
      : "none";

  document.getElementById(
    "editorSubtitle"
  ).textContent =
    tab.frequencyEnabled
      ? "Kies de frequentie en eventueel het aantal punten."
      : tab.pointsEnabled
        ? "Deze taak heeft geen vast tijdschema."
        : "Deze taak heeft geen vast tijdschema of punten.";

  document
    .getElementById(
      "taskEditorModal"
    )
    .classList.add(
      "show"
    );

  setTimeout(
    () =>
      titleInput.focus(),
    50
  );

}


function closeTaskEditor() {

  editingTaskId =
    null;

  editorTabId =
    null;

  document
    .getElementById(
      "taskEditorModal"
    )
    .classList.remove(
      "show"
    );

}


/* =========================================================
   SAVE TASK
========================================================= */

async function saveTaskFromEditor() {

  const tab =
    config.tabs.find(
      t =>
        t.id ===
        editorTabId
    );

  if (!tab) {
    return;
  }

  const title =
    document
      .getElementById(
        "taskTitleInput"
      )
      .value
      .trim();

  if (!title) {

    alert(
      "Geef de taak eerst een naam."
    );

    return;

  }

  const frequencyId =
    document
      .getElementById(
        "taskFrequencyInput"
      )
      .value ||
      null;

  const points =
    tab.pointsEnabled
      ? Math.max(
          0,
          Number(
            document
              .getElementById(
                "taskPointsInput"
              )
              .value
          ) || 0
        )
      : 0;

  let task = null;

  try {

    if (editingTaskId) {

      task =
        tab.tasks.find(
          t =>
            t.id ===
            editingTaskId
        );

      if (!task) {
        return;
      }

      task.title =
        title;

      task.points =
        points;

      task.frequencyId =
        tab.frequencyEnabled
          ? frequencyId
          : null;

    } else {

      task = {

        id:
          createId(),

        title,

        frequencyId:
          tab.frequencyEnabled
            ? frequencyId
            : null,

        points

      };

      tab.tasks.push(
        task
      );

    }

    setSyncStatus(
      "Opslaan…"
    );

    await saveTaskToDb(
      tab,
      task
    );

    saveLocalCache();

    closeTaskEditor();

    render();

    setSyncStatus(
      "Gesynchroniseerd"
    );

  } catch (error) {

    console.error(
      error
    );

    showToast(
      "Taak opslaan mislukt."
    );

  }

}


/* =========================================================
   DELETE TASK
========================================================= */

async function deleteTaskFromEditor() {

  if (!editingTaskId) {
    return;
  }

  const tab =
    config.tabs.find(
      t =>
        t.id ===
        editorTabId
    );

  if (!tab) {
    return;
  }

  const task =
    tab.tasks.find(
      t =>
        t.id ===
        editingTaskId
    );

  if (!task) {
    return;
  }

  if (
    !confirm(
      `Wil je "${task.title}" verwijderen?`
    )
  ) {
    return;
  }

  try {

    setSyncStatus(
      "Verwijderen…"
    );

    const result =
      await supabaseClient
        .from("tasks")
        .delete()
        .eq(
          "id",
          task.id
        )
        .eq(
          "household_id",
          householdId
        );

    if (result.error) {
      throw result.error;
    }

    tab.tasks =
      tab.tasks.filter(
        t =>
          t.id !==
          editingTaskId
      );

    /*
      Historische completions blijven bestaan.
      Daardoor blijft de geschiedenis zichtbaar.
    */

    saveLocalCache();

    closeTaskEditor();

    render();

    setSyncStatus(
      "Gesynchroniseerd"
    );

  } catch (error) {

    console.error(
      error
    );

    showToast(
      "Taak verwijderen mislukt."
    );

  }

}

function renderPoints() {

  ).textContent =

    "Partner";

  const left =
    document.getElementById(
      "balanceLeft"
    );

  const right =
    document.getElementById(
      "balanceRight"
    );

  const empty =
    document.getElementById(
      "balanceEmpty"
    );

  const description =
    document.getElementById(
      "balanceDescription"
    );

  const total =
    totals.you +
    totals.partner;

  if (
    total === 0
  ) {

    left.style.width =
      "0%";

    right.style.width =
      "0%";

    empty.style.display =
      "block";

    description.textContent =
      "Nog geen punten";

    return;

  }

  empty.style.display =

  const youPercentage =
    (
      totals.you /
      total
    ) * 100;

  const partnerPercentage =
    (
      totals.partner /
      total
    ) * 100;

  left.style.width =
    `${youPercentage}%`;

  right.style.width =
    `${partnerPercentage}%`;

  if (
    totals.you ===
    totals.partner
  ) {

    description.textContent =
      "Gelijk verdeeld";

  } else {

    description.textContent =
      `${config.youName || "Jij"} ${Math.round(
        youPercentage

/* =========================================================
   HISTORY
========================================================= */

function renderHistory() {

  const container =
    document.getElementById(
      "historyList"
    );

  container.innerHTML =
    "";

  if (
    !completions.length
  ) {

    container.innerHTML =
      `
      <div class="empty">
        Nog geen uitgevoerde taken.
      </div>
      `;

    return;

  }

  const sorted =
    completions
      .slice()
      .sort(
        (a, b) =>
          new Date(
            b.completedAt
          ) -
          new Date(
            a.completedAt
          )
      );

  sorted.forEach(
    completion => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      const main =
        document.createElement(
          "div"
        );

      main.className =
        "history-main";

      const left =
        document.createElement(
          "div"
        );

      const taskTitle =
        completion.taskTitle ||
        findTaskTitle(
          completion
        ) ||
        "Verwijderde taak";

      left.innerHTML =
        `
        <div class="history-task">
          ${escapeHtml(
            taskTitle
          )}
        </div>

        <div class="history-details">
          ${formatDateTime(
            completion.completedAt
          )}
          · ${escapeHtml(
            personLabel(
              completion.person
            )
          )}
        </div>
        `;

      const right =
        document.createElement(
          "div"
        );

      right.className =
        "history-points";

      if (
        Number(
          completion.points
        ) === 0
      ) {

        right.textContent =
          "Geen punten";

      } else if (
        completion.person ===
        "together"
      ) {

        right.textContent =
          `+${completion.points} elk`;

      } else {

        right.textContent =
          `+${completion.points}`;

      }

      main.appendChild(
        left
      );

      main.appendChild(
        right
      );

      const undo =
        document.createElement(
          "button"
        );

      undo.className =
        "undo-button";

      undo.textContent =
        "↩ Ongedaan maken";

      undo.onclick =
        () =>
          undoCompletion(
            completion.id
          );

      item.appendChild(
        main
      );

      item.appendChild(
        undo
      );

      container.appendChild(
        item
      );

    }
  );

}


function findTaskTitle(
  completion
) {

  for (
    const tab of config.tabs
  ) {

    const task =
      tab.tasks.find(
        t =>
          t.id ===
          completion.taskId
      );

    if (task) {
      return task.title;
    }

  }

  return "";

}


async function undoCompletion(
  id
) {

  const completion =
    completions.find(
      item =>
        item.id ===
        id
    );

  if (!completion) {
    return;
  }

  const title =
    completion.taskTitle ||
    findTaskTitle(
      completion
    ) ||
    "deze taak";

  if (
    !confirm(
      `Wil je "${title}" echt ongedaan maken?\n\nDe punten worden ook teruggedraaid.`
    )
  ) {
    return;
  }

  try {

    setSyncStatus(
      "Ongedaan maken…"
    );

    const result =
      await supabaseClient
        .from("completions")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "household_id",
          householdId
        );

    if (result.error) {
      throw result.error;
    }

    completions =
      completions.filter(
        item =>
          item.id !==
          id
      );

    saveLocalCache();

    render();

    setSyncStatus(
      "Gesynchroniseerd"
    );

  } catch (error) {

    console.error(
      error
    );

    showToast(
      "Ongedaan maken mislukt."
    );

  }

}

          let value =
            Math.floor(
              Number(
                intervalInput.value
              )
            );

          if (
            !Number.isFinite(
              value
            ) ||
            value < 1
          ) {
            value = 1;
          }

          if (
            value > 999
          ) {
            value = 999;
          }

          frequency.interval =
            value;

          if (
            !frequency.name ||
            frequency.name.startsWith(
              "Elke "
            )
          ) {

            frequency.name =
              makeFrequencyName(
                frequency.unit,
                value
              );

          }

          try {

            await saveFrequencyToDb(
              tab,
              frequency,
              frequencyIndex
            );

            saveLocalCache();

            renderSettings();
            renderTabViews();

          } catch (error) {

            console.error(
              error
            );

            showToast(
              "Frequentie opslaan mislukt."
            );

          }

        };

      intervalField.appendChild(
        intervalLabel
      );

      intervalField.appendChild(
        intervalInput
      );


      const unitField =
        document.createElement(
          "div"
        );

      unitField.className =
        "field unit-field";

      const unitLabel =
        document.createElement(
          "label"
        );

      unitLabel.textContent =
        "Eenheid";

      const unitSelect =
        document.createElement(
          "select"
        );

      [
        {
          value: "days",
          label: "Dagen"
        },
        {
          value: "weeks",
          label: "Weken"
        },
        {
          value: "months",
          label: "Maanden"
        }
      ].forEach(
        optionData => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            optionData.value;

          option.textContent =
            optionData.label;

          if (
            frequency.unit ===
            optionData.value
          ) {
            option.selected =
              true;
          }

          unitSelect.appendChild(
            option
          );

        }
      );

      unitSelect.onchange =
        async () => {

          frequency.unit =
            unitSelect.value;

          if (
            !frequency.name ||
            frequency.name.startsWith(
              "Elke "
            )
          ) {

            frequency.name =
              makeFrequencyName(
                frequency.unit,
                frequency.interval
              );

          }

          try {

            await saveFrequencyToDb(
              tab,
              frequency,
              frequencyIndex
            );

            saveLocalCache();

            renderSettings();
            renderTabViews();

          } catch (error) {

            console.error(
              error
            );

            showToast(
              "Frequentie opslaan mislukt."
            );

          }

        };

      unitField.appendChild(
        unitLabel
      );

      unitField.appendChild(
        unitSelect
      );


      const removeButton =
        document.createElement(
          "button"
        );

      removeButton.type =
        "button";

      removeButton.className =
        "frequency-remove";

      removeButton.textContent =
        "×";

      removeButton.title =
        "Frequentie verwijderen";

      removeButton.onclick =
        async () => {

          const used =
            tab.tasks.some(
              task =>
                task.frequencyId ===
                frequency.id
            );

          if (used) {

            alert(
              "Deze frequentie wordt nog gebruikt door één of meerdere taken. Pas eerst die taken aan."
            );

            return;

          }

          try {

            const result =
              await supabaseClient
                .from("frequencies")
                .delete()
                .eq(
                  "id",
                  frequency.id
                )
                .eq(
                  "household_id",
                  householdId
                );

            if (result.error) {
              throw result.error;
            }

            tab.frequencies =
              tab.frequencies.filter(
                f =>
                  f.id !==
                  frequency.id
              );

            saveLocalCache();

            renderSettings();
            renderTabViews();

          } catch (error) {

            console.error(
              error
            );

            showToast(
              "Frequentie verwijderen mislukt."
            );

          }

        };


      grid.appendChild(
        nameField
      );

      grid.appendChild(
        intervalField
      );

      grid.appendChild(
        unitField
      );

      grid.appendChild(
        removeButton
      );

      row.appendChild(
        grid
      );


      const example =
        document.createElement(
          "div"
        );

      example.className =
        "frequency-example";

      example.textContent =
        `Technisch interval: elke ${frequency.interval} ${
          frequency.unit === "days"
            ? frequency.interval === 1
              ? "dag"
              : "dagen"
            : frequency.unit === "weeks"
              ? frequency.interval === 1
                ? "week"
                : "weken"
              : frequency.interval === 1
                ? "maand"
                : "maanden"
        }`;

      row.appendChild(
        example
      );

      wrapper.appendChild(
        row
      );

    }
  );


  const addButton =
    document.createElement(
      "button"
    );

  addButton.type =
    "button";

  addButton.className =
    "add-frequency-button";

  addButton.textContent =
    "＋ Frequentie toevoegen";

  addButton.onclick =
    async () => {

      const frequency = {

        id:
          createId(),

        name:
          "Elke 1 week",

        unit:
          "weeks",

        interval:
          1

      };

      try {

        await saveFrequencyToDb(
          tab,
          frequency,
          tab.frequencies.length
        );

        tab.frequencies.push(
          frequency
        );

        saveLocalCache();

        renderSettings();
        renderTabViews();

      } catch (error) {

        console.error(
          error
        );

        showToast(
          "Frequentie toevoegen mislukt."
        );

      }

    };

  wrapper.appendChild(
    addButton
  );

  container.appendChild(
    wrapper
  );

}


/* =========================================================
   ALL SETTINGS SAVE
========================================================= */

async function saveAllSettings() {

  const appName =
    document.getElementById(
      "settingsAppName"
    ).value.trim();

  const subtitle =
    document.getElementById(
      "settingsSubtitle"
    ).value.trim();

  const youName =
    document.getElementById(
      "settingsYouName"
    ).value.trim();

  const partnerName =
    document.getElementById(
      "settingsPartnerName"
    ).value.trim();

  const startDate =
    document.getElementById(
      "settingsStartDate"
    ).value;

  config.appName =
    appName ||
    "Huishouden";

  config.appSubtitle =
    subtitle ||
    "Taken overzicht";

  config.youName =
    youName ||
    "Jij";

  config.partnerName =
    partnerName ||
    "Partner";

  config.startDate =
    startDate ||
    "";


  config.tabs.forEach(
    (
      tab,
      index
    ) => {

      const nameInput =
        document.getElementById(
          `tabName${index}`
        );

      if (nameInput) {

        tab.name =
          nameInput.value.trim() ||
          `Tab ${index + 1}`;

      }

    }
  );


  try {

    setSyncStatus(
      "Instellingen opslaan…"
    );

    /*
      Ondertitel heeft geen kolom in de bestaande
      Supabase-tabel en wordt daarom lokaal bewaard.
    */

    localStorage.setItem(
      STORAGE_KEYS.subtitle,
      config.appSubtitle
    );

    await saveHouseholdName();
    await saveHouseholdSettings();

    for (
      let index = 0;
      index < config.tabs.length;
      index++
    ) {

      await saveTabToDb(
        config.tabs[index],
        index
      );

    }

    for (
      const tab of config.tabs
    ) {

      for (
        let index = 0;
        index < tab.frequencies.length;
        index++
      ) {

        await saveFrequencyToDb(
          tab,
          tab.frequencies[index],
          index
        );

      }

    }

    for (
      const tab of config.tabs
    ) {

      for (
        const task of tab.tasks
      ) {

        await saveTaskToDb(
          tab,
          task
        );

      }

    }

    saveLocalCache();

    render();

    setSyncStatus(
      "Gesynchroniseerd"
    );

    alert(
      "Instellingen opgeslagen."
    );

  } catch (error) {

    console.error(
      error
    );

    setSyncStatus(
      "Synchronisatiefout"
    );

    alert(
      "De instellingen konden niet volledig worden opgeslagen."
    );

  }

}
