<script>
/* =========================================================

const STORAGE_KEY = "householdGenericTemplateV1";

const DEFAULT_DATA = {

};


let data = loadData();

let currentView = {

/* =========================================================
   STORAGE
========================================================= */

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function loadData() {
  const stored = localStorage.getItem(STORAGE_KEY);

  if (!stored) {
    return clone(DEFAULT_DATA);
  }

  try {
    const parsed = JSON.parse(stored);

    if (!parsed.settings || !Array.isArray(parsed.settings.tabs)) {
      return clone(DEFAULT_DATA);
    }

    return parsed;

  } catch {
    return clone(DEFAULT_DATA);
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}


/* =========================================================
   HELPERS
========================================================= */

function uid(prefix = "id") {
  return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getTab(tabId) {
  return data.settings.tabs.find(tab => tab.id === tabId);
}

function getTask(taskId) {
  return data.tasks.find(task => task.id === taskId);
}

function getFrequency(tab, frequencyId) {
  if (!tab || !tab.frequencies) return null;

  return (
    tab.frequencies.find(freq => freq.id === frequencyId) ||
    tab.frequencies[0] ||
    null
  );
}

function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function parseDate(value) {
  if (!value) return null;

  if (value instanceof Date) {
    const d = new Date(value);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  return new Date(value + "T00:00:00");
}

function addDays(date, amount) {
  const d = new Date(date);
  d.setDate(d.getDate() + amount);
  return d;
}

function formatDate(date) {
  if (!date) return "";

  const d = date instanceof Date ? date : parseDate(date);

  return d.toLocaleDateString("nl-BE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

function dateKey(date) {
  const d = date instanceof Date ? date : parseDate(date);

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();

  const difference = day === 0 ? -6 : 1 - day;

  d.setDate(d.getDate() + difference);
  d.setHours(0, 0, 0, 0);

  return d;
}


/* =========================================================
   PERIODS / FREQUENCIES
========================================================= */

function getPeriodInfo(task, date = today()) {
  const tab = getTab(task.tabId);

  if (!tab || tab.type !== "recurring") {
    return null;
  }

  const frequency = getFrequency(tab, task.frequencyId);

  if (!frequency) {
    return null;
  }

  const d = new Date(date);
  d.setHours(0, 0, 0, 0);

  let start;
  let end;

  if (frequency.type === "weekly") {

    start = getMonday(d);
    end = addDays(start, 6);

  } else if (frequency.type === "biweekly") {

    let anchor;

    if (data.settings.startDate) {
      anchor = getMonday(parseDate(data.settings.startDate));
    } else {
      anchor = new Date(2020, 0, 6);
    }

    const diffDays = Math.floor(
      (getMonday(d) - anchor) / 86400000
    );

    const block = Math.floor(diffDays / 14);

    start = addDays(anchor, block * 14);
    end = addDays(start, 13);

  } else if (frequency.type === "monthly") {

    start = new Date(d.getFullYear(), d.getMonth(), 1);
    end = new Date(d.getFullYear(), d.getMonth() + 1, 0);

    start.setHours(0, 0, 0, 0);
    end.setHours(0, 0, 0, 0);

  } else {

    return null;
  }

  return {
    start,
    end,
    key: frequency.id + "_" + dateKey(start),
    label: frequency.label
  };
}

function getPreviousPeriodInfo(task) {
  const current = getPeriodInfo(task);

  if (!current) return null;

  const tab = getTab(task.tabId);
  const frequency = getFrequency(tab, task.frequencyId);

  if (!frequency) return null;

  let previousDate;

  if (frequency.type === "weekly") {
    previousDate = addDays(current.start, -1);

  } else if (frequency.type === "biweekly") {
    previousDate = addDays(current.start, -1);

  } else if (frequency.type === "monthly") {
    previousDate = new Date(
      current.start.getFullYear(),
      current.start.getMonth(),
      0
    );

  } else {
    return null;
  }

  return getPeriodInfo(task, previousDate);
}

function getCompletionForPeriod(task, periodKey) {
  return data.completions
    .filter(c =>
      c.taskId === task.id &&
      c.period === periodKey
    )
    .sort((a, b) =>
      new Date(b.completedAt) - new Date(a.completedAt)
    )[0] || null;
}

function getCurrentCompletion(task) {
  const period = getPeriodInfo(task);

  if (!period) return null;

  return getCompletionForPeriod(task, period.key);
}

function isOverdue(task) {
  const tab = getTab(task.tabId);

  if (!tab || tab.type !== "recurring") {
    return false;
  }

  const current = getPeriodInfo(task);
  const previous = getPreviousPeriodInfo(task);

  if (!current || !previous) {
    return false;
  }

  if (getCurrentCompletion(task)) {
    return false;
  }

  const now = today();

  if (now < current.start) {
    return false;
  }

  if (previous.end >= now) {
    return false;
  }

  if (task.createdAt) {
    const created = new Date(task.createdAt);

    if (previous.end < created) {
      return false;
    }
  }

  if (data.settings.startDate) {
    const startDate = parseDate(data.settings.startDate);

    if (previous.end < startDate) {
      return false;
    }
  }

  return !getCompletionForPeriod(task, previous.key);
}


/* =========================================================
   RENDER
========================================================= */

function render() {
  document.title = data.settings.appName || "Huishouden";

  document.getElementById("appTitle").textContent =
    data.settings.appName || "Huishouden";

  document.getElementById("youButtonName").textContent =
    data.settings.youName || "Jij";

  document.getElementById("partnerButtonName").textContent =
    data.settings.partnerName || "Partner";

  renderTabs();

  const main = document.getElementById("mainContent");

  if (currentView.type === "tab") {
    renderTab(main, currentView.id);

  } else if (currentView.type === "points") {
    renderPoints(main);

  } else if (currentView.type === "history") {
    renderHistory(main);

  } else if (currentView.type === "settings") {
    renderSettings(main);
  }
}

function renderTabs() {
  const bar = document.getElementById("tabBar");

  bar.innerHTML = data.settings.tabs.map(tab => `
    <button
      class="tab-button ${currentView.type === "tab" && currentView.id === tab.id ? "active" : ""}"
      onclick="showTab('${tab.id}')"
    >
      ${escapeHtml(tab.icon || "")} ${escapeHtml(tab.name)}
    </button>
  `).join("");
}


/* =========================================================
   TAB VIEW
========================================================= */

function renderTab(container, tabId) {
  const tab = getTab(tabId);

  if (!tab) {
    currentView = {
      type: "tab",
      id: data.settings.tabs[0]?.id
    };

    render();
    return;
  }

  container.innerHTML = `
    <div class="page-header">
      <h2 class="page-title">
        ${escapeHtml(tab.icon || "")} ${escapeHtml(tab.name)}
      </h2>

      <button class="primary-button" onclick="openTaskEditor('${tab.id}')">
        + Taak
      </button>
    </div>
  `;

  if (tab.type === "recurring") {
    renderRecurringTab(container, tab);
  } else {
    renderNormalTab(container, tab);
  }
}

function renderRecurringTab(container, tab) {
  const wrapper = document.createElement("div");

  const frequencies = tab.frequencies || [];

  frequencies.forEach(frequency => {

    const tasks = data.tasks
      .filter(task =>
        task.tabId === tab.id &&
        task.frequencyId === frequency.id
      )
      .sort(sortTasks);

    const section = document.createElement("section");
    section.className = "frequency-section";

    section.innerHTML = `
      <h3 class="frequency-title">
        ${escapeHtml(frequency.label)}
      </h3>
    `;

    const list = document.createElement("div");
    list.className = "task-list";

    if (tasks.length === 0) {
      list.innerHTML = `
        <div class="empty" style="padding:20px;">
          Nog geen taken.
        </div>
      `;
    } else {
      tasks.forEach(task => {
        list.appendChild(createTaskElement(task));
      });
    }

    section.appendChild(list);
    wrapper.appendChild(section);
  });

  if (frequencies.length === 0) {
    wrapper.innerHTML = `
      <div class="empty">
        Voeg eerst een frequentie toe via Instellingen.
      </div>
    `;
  }

  container.appendChild(wrapper);
}

function renderNormalTab(container, tab) {
  const tasks = data.tasks
    .filter(task => task.tabId === tab.id)
    .sort(sortTasks);

  const list = document.createElement("div");
  list.className = "task-list";

  if (tasks.length === 0) {
    list.innerHTML = `
      <div class="empty">
        Nog geen taken.
      </div>
    `;
  } else {
    tasks.forEach(task => {
      list.appendChild(createTaskElement(task));
    });
  }

  container.appendChild(list);
}

function sortTasks(a, b) {
  const tab = getTab(a.tabId);

  if (tab?.type === "recurring") {
    const aOverdue = isOverdue(a);
    const bOverdue = isOverdue(b);

    if (aOverdue !== bOverdue) {
      return aOverdue ? -1 : 1;
    }

    const aDone = !!getCurrentCompletion(a);
    const bDone = !!getCurrentCompletion(b);

    if (aDone !== bDone) {
      return aDone ? 1 : -1;
    }
  }

  return a.title.localeCompare(b.title, "nl");
}

function createTaskElement(task) {
  const tab = getTab(task.tabId);

  const element = document.createElement("div");
  element.className = "task";

  let status = "gray";
  let meta = "";

  if (tab.type === "recurring") {

    if (getCurrentCompletion(task)) {
      status = "green";

      const completion = getCurrentCompletion(task);

      meta =
        "Gedaan door " +
        escapeHtml(personName(completion.person));

    } else if (isOverdue(task)) {
      status = "red";

      const previous = getPreviousPeriodInfo(task);

      meta =
        "Achterstallig sinds " +
        formatDate(previous?.start);

    } else {
      status = "gray";

      const frequency = getFrequency(tab, task.frequencyId);

      meta = escapeHtml(frequency?.label || "");
    }

  } else if (tab.type === "repeatable") {

    const last = data.completions
      .filter(c => c.taskId === task.id)
      .sort((a, b) =>
        new Date(b.completedAt) - new Date(a.completedAt)
      )[0];

    if (last) {
      status = "green";
      meta =
        "Laatst gedaan door " +
        escapeHtml(personName(last.person)) +
        " · " +
        formatDate(new Date(last.completedAt));
    } else {
      status = "gray";
      meta = "Nog niet gedaan";
    }

  } else {

    status = "gray";
    meta = "Eenmalige taak";
  }

  element.classList.add("status-" + status);

  const pointsHtml =
    tab.pointsEnabled && task.points > 0
      ? `<span class="task-points">${task.points} pt</span>`
      : "";

  element.innerHTML = `
    <div class="task-main">
      <div class="task-title">${escapeHtml(task.title)}</div>
      <div class="task-meta">${meta}</div>
    </div>

    ${pointsHtml}

    <div class="task-actions">
      <button
        class="icon-button"
        title="Bewerken"
        onclick="openTaskEditor('${task.tabId}', '${task.id}')"
      >
        ✏️
      </button>

      <button
        class="complete-button"
        onclick="openCompletion('${task.id}')"
      >
        ✓
      </button>
    </div>
  `;

  return element;
}


/* =========================================================
   TASK EDITOR
========================================================= */

function openTaskEditor(tabId, taskId = null) {
  const tab = getTab(tabId);

  if (!tab) return;

  editingTabId = tabId;
  editingTaskId = taskId;

  const task = taskId ? getTask(taskId) : null;

  document.getElementById("taskModalTitle").textContent =
    task ? "Taak bewerken" : "Taak toevoegen";

  document.getElementById("taskName").value =
    task?.title || "";

  const frequencyField =
    document.getElementById("taskFrequencyField");

  const frequencySelect =
    document.getElementById("taskFrequency");

  const pointsField =
    document.getElementById("taskPointsField");

  const pointsInput =
    document.getElementById("taskPoints");

  const deleteButton =
    document.getElementById("deleteTaskButton");

  if (tab.type === "recurring") {

    frequencyField.style.display = "";

    frequencySelect.innerHTML =
      (tab.frequencies || []).map(freq => `
        <option value="${escapeHtml(freq.id)}">
          ${escapeHtml(freq.label)}
        </option>
      `).join("");

    if (task?.frequencyId) {
      frequencySelect.value = task.frequencyId;
    }

  } else {
    frequencyField.style.display = "none";
  }

  if (tab.pointsEnabled) {
    pointsField.style.display = "";
    pointsInput.value = task?.points ?? 1;
  } else {
    pointsField.style.display = "none";
    pointsInput.value = 0;
  }

  deleteButton.style.display = task ? "" : "none";

  openModal("taskModal");

  setTimeout(() => {
    document.getElementById("taskName").focus();
  }, 50);
}

function saveTask() {
  const tab = getTab(editingTabId);

  if (!tab) return;

  const title =
    document.getElementById("taskName").value.trim();

  if (!title) {
    alert("Geef de taak een naam.");
    return;
  }

  let frequencyId = null;

  if (tab.type === "recurring") {
    frequencyId =
      document.getElementById("taskFrequency").value;

    if (!frequencyId) {
      alert("Kies een frequentie.");
      return;
    }
  }

  const points =
    tab.pointsEnabled
      ? Math.max(
          0,
          parseInt(document.getElementById("taskPoints").value, 10) || 0
        )
      : 0;

  if (editingTaskId) {

    const task = getTask(editingTaskId);

    if (!task) return;

    task.title = title;
    task.frequencyId = frequencyId;
    task.points = points;

  } else {

    data.tasks.push({
      id: uid("task"),
      title,
      tabId: tab.id,
      frequencyId,
      points,
      createdAt: new Date().toISOString()
    });
  }

  saveData();
  closeModal("taskModal");
  render();
}

function deleteCurrentTask() {
  if (!editingTaskId) return;

  const task = getTask(editingTaskId);

  if (!task) return;

  if (!confirm(
    `Wil je "${task.title}" verwijderen?`
  )) {
    return;
  }

  data.tasks =
    data.tasks.filter(task => task.id !== editingTaskId);

  saveData();
  closeModal("taskModal");
  render();
}


/* =========================================================
   COMPLETION
========================================================= */

function openCompletion(taskId) {
  const task = getTask(taskId);

  if (!task) return;

  const tab = getTab(task.tabId);

  if (
    tab.type === "recurring" &&
    getCurrentCompletion(task)
  ) {
    return;
  }

  completionTaskId = taskId;

  document.getElementById("completionTaskName").textContent =
    task.title;

  openModal("completionModal");
}

function completeTask(person) {
  const task = getTask(completionTaskId);

  if (!task) return;

  const tab = getTab(task.tabId);

  const period =
    tab.type === "recurring"
      ? getPeriodInfo(task)
      : null;

  const completion = {
    id: uid("completion"),

    taskId: task.id,
    taskTitle: task.title,

    tabId: task.tabId,
    tabName: tab.name,

    taskType: tab.type,

    frequencyId: task.frequencyId,

    person,

    points:
      tab.pointsEnabled
        ? task.points
        : 0,

    period:
      period?.key || null,

    completedAt:
      new Date().toISOString()
  };

  data.completions.push(completion);

  /*
    Bij een eenmalige taak wordt de taak uit
    de actieve lijst verwijderd.
  */

  if (tab.type === "one_time") {
    data.tasks =
      data.tasks.filter(t => t.id !== task.id);
  }

  saveData();

  closeModal("completionModal");

  render();
}

function personName(person) {
  if (person === "you") {
    return data.settings.youName || "Jij";

  if (person === "partner") {

  return "Samen";
}

   HISTORY
========================================================= */

function renderHistory(container) {
  const history =
    [...data.completions]
      .sort((a, b) =>
        new Date(b.completedAt) -
        new Date(a.completedAt)
      );

  container.innerHTML = `
    <div class="page-header">
      <h2 class="page-title">📜 Geschiedenis</h2>
    </div>
  `;

  if (history.length === 0) {
    container.innerHTML += `
      <div class="empty">
        Nog geen geschiedenis.
      </div>
    `;

    return;
  }

  const card = document.createElement("div");
  card.className = "card";

  history.forEach(completion => {

    const item = document.createElement("div");
    item.className = "history-item";

    const points =
      completion.points
        ? ` · ${completion.points} pt`
        : "";

    item.innerHTML = `
      <div class="history-top">
        <strong>${escapeHtml(completion.taskTitle)}</strong>

        <span>
          ${escapeHtml(personName(completion.person))}
        </span>
      </div>

      <div class="history-meta">
        ${escapeHtml(completion.tabName || "")}
        ·
        ${formatDate(new Date(completion.completedAt))}
        ${points}
      </div>

      <div style="margin-top:8px;">
        <button
          class="secondary-button"
          onclick="undoCompletion('${completion.id}')"
        >
          Ongedaan maken
        </button>
      </div>
    `;

    card.appendChild(item);
  });

  container.appendChild(card);
}

function undoCompletion(completionId) {
  const completion =
    data.completions.find(c => c.id === completionId);

  if (!completion) return;

  const taskExists =
    !!getTask(completion.taskId);

  /*
    Bij een eenmalige taak moet de taak opnieuw
    aangemaakt worden wanneer de voltooiing
    ongedaan wordt gemaakt.
  */

  if (!taskExists && completion.taskType === "one_time") {

    data.tasks.push({
      id: completion.taskId,
      title: completion.taskTitle,
      tabId: completion.tabId,
      frequencyId: completion.frequencyId || null,
      points: completion.points || 0,
      createdAt: completion.completedAt
    });
  }

  data.completions =
    data.completions.filter(c => c.id !== completionId);

  saveData();

  render();
}

/* =========================================================
   SETTINGS – TABS
========================================================= */

function addTab() {
  if (data.settings.tabs.length >= 8) {
    alert("Je kunt maximaal 8 tabbladen gebruiken.");
    return;
  }

  data.settings.tabs.push({
    id: uid("tab"),
    name: "Nieuwe tab",
    icon: "📋",
    type: "repeatable",
    pointsEnabled: true,
    frequencies: []
  });

  saveData();
  renderSettings(document.getElementById("mainContent"));
}

function deleteTab(tabId) {
  const tab = getTab(tabId);

  if (!tab) return;

  if (!confirm(
    `Wil je tab "${tab.name}" verwijderen? De taken in deze tab worden ook verwijderd.`
  )) {
    return;
  }

  const taskIds =
    data.tasks
      .filter(task => task.tabId === tabId)
      .map(task => task.id);

  data.tasks =
    data.tasks.filter(task => task.tabId !== tabId);

  data.completions =
    data.completions.filter(
      completion =>
        completion.tabId !== tabId &&
        !taskIds.includes(completion.taskId)
    );

  data.settings.tabs =
    data.settings.tabs.filter(tab => tab.id !== tabId);

  if (
    currentView.type === "tab" &&
    currentView.id === tabId
  ) {
    currentView = {
      type: "tab",
      id: data.settings.tabs[0].id
    };
  }

  saveData();
  render();
}

function addFrequency(tabId) {
  const tab = getTab(tabId);

  if (!tab) return;

  tab.frequencies.push({
    id: uid("freq"),
    label: "Nieuwe frequentie",
    type: "weekly"
  });

  saveData();
  renderSettings(document.getElementById("mainContent"));
}

function deleteFrequency(tabId, frequencyId) {
  const tab = getTab(tabId);

  if (!tab) return;

  if (tab.frequencies.length <= 1) {
    alert(
      "Een tab met frequenties moet minstens één frequentie hebben."
    );
    return;
  }

  const frequency =
    tab.frequencies.find(f => f.id === frequencyId);

  if (!frequency) return;

  const replacement =
    tab.frequencies.find(f => f.id !== frequencyId);

  const affectedTasks =
    data.tasks.filter(
      task =>
        task.tabId === tabId &&
        task.frequencyId === frequencyId
    );

  if (
    affectedTasks.length &&
    !confirm(
      `Er zijn ${affectedTasks.length} taak/taken met deze frequentie. Deze worden gekoppeld aan "${replacement.label}". Doorgaan?`
    )
  ) {
    return;
  }

  affectedTasks.forEach(task => {
    task.frequencyId = replacement.id;
  });

  tab.frequencies =
    tab.frequencies.filter(
      f => f.id !== frequencyId
    );

  saveData();
  renderSettings(document.getElementById("mainContent"));
}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {
  const appName =
    document.getElementById("settingsAppName").value.trim();

  const youName =
    document.getElementById("settingsYouName").value.trim();

  const partnerName =
    document.getElementById("settingsPartnerName").value.trim();

  const startDate =
    document.getElementById("settingsStartDate").value;

  if (!appName) {
    alert("Geef de app een naam.");
    return;
  }

  data.settings.appName = appName;
  data.settings.youName = youName || "Jij";
  data.settings.partnerName = partnerName || "Partner";
  data.settings.startDate = startDate;

  const cards =
    document.querySelectorAll(".tab-config");

  const newTabs = [];

  cards.forEach(card => {

    const tabId = card.dataset.tabId;
    const oldTab = getTab(tabId);

    if (!oldTab) return;

    const name =
      card.querySelector("[data-tab-name]").value.trim();

    const icon =
      card.querySelector("[data-tab-icon]").value.trim();

    const type =
      card.querySelector("[data-tab-type]").value;

    const pointsEnabled =
      card.querySelector("[data-tab-points]").checked;

    const frequencies = [];

    if (type === "recurring") {

      card.querySelectorAll(".frequency-row")
        .forEach(row => {

          const label =
            row.querySelector("[data-frequency-label]")
              .value.trim();

          const frequencyType =
            row.querySelector("[data-frequency-type]").value;

          if (label) {
            frequencies.push({
              id: row.dataset.frequencyId,
              label,
              type: frequencyType
            });
          }
        });

      if (frequencies.length === 0) {
        alert(
          `Tab "${name || "zonder naam"}" heeft minstens één frequentie nodig.`
        );

        return;
      }
    }

    newTabs.push({
      id: tabId,
      name: name || "Tab",
      icon: icon || "📋",
      type,
      pointsEnabled:
        type === "one_time"
          ? false
          : pointsEnabled,
      frequencies
    });
  });

  if (newTabs.length !== data.settings.tabs.length) {
    return;
  }

  data.settings.tabs = newTabs;

  /*
    Bestaande taken automatisch aanpassen wanneer
    een tab van type verandert.
  */

  data.tasks.forEach(task => {

    const tab = getTab(task.tabId);

    if (!tab) return;

    if (tab.type === "recurring") {

      const frequencyExists =
        tab.frequencies.some(
          f => f.id === task.frequencyId
        );

      if (!frequencyExists) {
        task.frequencyId =
          tab.frequencies[0]?.id || null;
      }

    } else {

      task.frequencyId = null;
    }

    if (!tab.pointsEnabled) {
      task.points = 0;
    }
  });

  saveData();

  currentView = {
    type: "settings"
  };

  render();

  alert("Instellingen opgeslagen.");
}

function showTab(tabId) {
  currentView = {
    type: "tab",
    id: tabId
  };

  closeMenu();
  render();
}

function showSpecialView(type) {
  currentView = {
    type
  };

  closeMenu();
  render();
}


/* =========================================================
   MENU
========================================================= */

function toggleMenu() {
  document
    .getElementById("mainMenu")
    .classList.toggle("open");
}

function closeMenu() {
  document
    .getElementById("mainMenu")
    .classList.remove("open");
}

document.addEventListener("click", event => {
  const menu = document.getElementById("mainMenu");
  const button = document.getElementById("menuButton");

  if (
    !menu.contains(event.target) &&
    !button.contains(event.target)
  ) {
    closeMenu();
  }
});


/* =========================================================
   MODALS
========================================================= */

function openModal(id) {
  document
    .getElementById(id)
    .classList.add("open");
}

function closeModal(id) {
  document
    .getElementById(id)
    .classList.remove("open");

  if (id === "taskModal") {
    editingTaskId = null;
    editingTabId = null;
  }

  if (id === "completionModal") {
    completionTaskId = null;
  }
}

document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
  backdrop.addEventListener("click", event => {
    if (event.target === backdrop) {
      backdrop.classList.remove("open");
    }
  });
});


/* =========================================================
   START
========================================================= */

render();

</script>
